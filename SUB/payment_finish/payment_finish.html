
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>입덕볶이 - 결제완료</title>

  <!-- Noto Sans KR -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap">

  <!-- 외부 CSS -->
  <link rel="stylesheet" href="CSS/payment_finish.css">

  <!-- Lucide 아이콘 -->
  <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

  <div class="container">

    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="header">

      <div class="logo">

        <img src="../detail/img/ChatGPT 이미지 2026년 11월 24일 오전 11_19_26-1.png"
             alt="입덕볶이 로고">

      </div>

    </header>


    <main>

      <!-- ========================================
           SECTION 1
           결제완료 안내
      ========================================= -->

      <section class="complete-section">

        <!-- 결제완료 체크 아이콘 -->

        <div class="complete-icon-area">

          <div class="complete-icon">

            <i data-lucide="check"></i>

          </div>

        </div>


        <!-- 결제완료 타이틀 -->

        <h1 class="complete-title">
          주문이 완료되었어요!
        </h1>

        <p class="complete-slogan">
          한 입 먹으면, 입덕 완료!
        </p>

        <p class="complete-description">
          맛있는 떡볶이를 만날 시간!<br>
          테스트 주문이 정상적으로 접수되었습니다.
        </p>

      </section>


      <!-- ========================================
           SECTION 2
           예상 배달시간
      ========================================= -->

      <section class="delivery-section">

        <div class="delivery-icon">

          <i data-lucide="bike"></i>

        </div>

        <div class="delivery-info">

          <p class="delivery-label">
            예상 배달시간 (예시)
          </p>

          <h2 class="delivery-time">
            약 30~40분
          </h2>

        </div>

      </section>


      <!-- ========================================
           SECTION 3
           주문 정보
      ========================================= -->

      <section class="order-section">

        <h2 class="section-title">
          주문 정보
        </h2>


        <!-- 주문번호 -->

        <div class="order-number-row">

          <span>주문번호</span>

          <strong id="orderNumber">-</strong>

        </div>


        <!-- 주문한 음식 -->

        <div class="order-product">

          <div class="order-image"
               id="orderImage"
               role="img">
          </div>

          <div class="order-product-info">

            <h3 id="orderName"></h3>

            <p id="orderQuantity"></p>

            <strong id="orderProductPrice"></strong>

          </div>

        </div>


        <!-- 맵기 및 토핑 -->

        <div class="order-options">

          <div class="info-row">

            <span>맵기 선택</span>

            <strong id="orderSpicy"></strong>

          </div>

          <div class="info-row topping-row">

            <span>추가 토핑</span>

            <div id="orderToppings"></div>

          </div>

        </div>


        <!-- 결제수단 -->

        <div class="payment-method-area">

          <div class="info-row">

            <span>결제수단</span>

            <strong id="paymentMethod"></strong>

          </div>

        </div>

      </section>


      <!-- ========================================
           SECTION 4
           결제금액
      ========================================= -->

      <section class="price-section">

        <h2 class="section-title">
          결제 정보
        </h2>

        <div class="price-info">

          <div class="info-row">

            <span>총 주문금액</span>

            <strong id="orderTotal">0원</strong>

          </div>

          <div class="info-row">

            <span>캐시 사용금액</span>

            <span id="cashDiscount">- 0원</span>

          </div>

          <div class="info-row">

            <span>상품권 할인금액</span>

            <span id="couponDiscount">- 0원</span>

          </div>

        </div>


        <!-- 최종 결제금액 -->

        <div class="final-price-row">

          <h2 id="finalPriceLabel">
            최종 결제금액
          </h2>

          <strong id="finalPrice">0원</strong>

        </div>

      </section>


      <!-- 테스트용 안내 -->

      <p class="demo-guide">
        수업용 테스트 주문이며 실제 결제 및 배달은 진행되지 않습니다.
      </p>

      <p class="invalid-order"
         id="invalidOrder"
         hidden>
        주문 정보가 없습니다. 메뉴를 선택하고 다시 주문해주세요.
      </p>


      <!-- ========================================
           SECTION 5
           하단 이동 버튼
      ========================================= -->

      <section class="button-section">

        <!-- 메인페이지 이동 -->

        <a href="../../index.html"
           class="home-btn">

          <i data-lucide="house"></i>

          <span>홈으로 돌아가기</span>

        </a>


        <!-- 메뉴 리스트 이동 -->

        <a href="../list/list.html"
           class="menu-list-btn">

          <i data-lucide="utensils"></i>

          <span>메뉴 다시 보기</span>

        </a>

      </section>

    </main>

  </div>


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script>

    // ========================================
    // 메뉴별 데이터
    // 기존 상세페이지 음식 이미지 연결
    // ========================================

    const menuData = {

      signature: {

        name: '입덕 시그니처 떡볶이',

        price: 9900,

        image: '../detail/img/시그니쳐.png'

      },

      cheese: {

        name: '치즈폭탄 떡볶이',

        price: 11900,

        image: '../detail/img/치즈폭탄.png'

      },

      rose: {

        name: '로제 떡볶이',

        price: 11500,

        image: '../detail/img/로제.png'

      },

      crispy: {

        name: '바삭토핑 떡볶이',

        price: 12500,

        image: '../detail/img/바삭토핑.png'

      }

    };


    // ========================================
    // 토핑 정보
    // ========================================

    const toppingData = [

      {
        name: '모짜렐라 치즈 추가',
        price: 2000
      },

      {
        name: '계란 추가',
        price: 1000
      },

      {
        name: '소시지 추가',
        price: 1500
      },

      {
        name: '어묵 추가',
        price: 1000
      }

    ];


    // ========================================
    // 결제페이지 주문 정보 가져오기
    // ========================================

    const params = new URLSearchParams(
      window.location.search
    );

    const menuKey = params.get('menu');

    const orderNumber = params.get('orderNumber');

    const receivedQuantity = Number(
      params.get('quantity')
    );


    // 주문 정보 유효성 확인

    const hasValidOrder =

      /^IP-\d+$/.test(orderNumber || '') &&

      Object.prototype.hasOwnProperty.call(
        menuData,
        menuKey
      ) &&

      Number.isSafeInteger(receivedQuantity) &&

      receivedQuantity > 0 &&

      receivedQuantity <= Math.floor(
        Number.MAX_SAFE_INTEGER / 20000
      );


    // 가격에 쉼표 적용

    function formatPrice(price) {

      return price.toLocaleString('ko-KR') + '원';

    }


    // ========================================
    // 정상적으로 주문 정보가 전달된 경우
    // ========================================

    if (hasValidOrder) {

      const selectedMenu = menuData[menuKey];

      const quantity = receivedQuantity;


      // 맵기 정보

      const spicyOptions = [

        '순한맛',
        '보통맛',
        '매운맛'

      ];

      const spicy = spicyOptions.includes(
        params.get('spicy')
      )

        ? params.get('spicy')

        : '순한맛';


      // 추가 토핑 정보

      const toppingParam = params.get('toppings') || '';

      const toppingIndexes = [...new Set(

        toppingParam
          .split(',')
          .filter(value => /^[0-3]$/.test(value))
          .map(Number)

      )];


      const selectedToppings = toppingIndexes.map(

        index => toppingData[index]

      );


      // 토핑 가격 계산

      const toppingTotal = selectedToppings.reduce(

        (sum, topping) => sum + topping.price,

        0

      );


      // 총 주문금액

      const orderTotal =

        (selectedMenu.price + toppingTotal) * quantity;


      // 상품권 할인금액

      const couponAmount =

        Number(params.get('coupon')) === 1000

          ? Math.min(1000, orderTotal)

          : 0;


      // 캐시 할인금액

      const receivedCash = Number(params.get('cash'));

      const maxCash = Math.floor(

        Math.min(
          10523,
          orderTotal - couponAmount
        ) / 10

      ) * 10;


      const usedCash = Number.isSafeInteger(receivedCash)

        ? Math.min(

            maxCash,

            Math.max(
              0,
              Math.floor(receivedCash / 10) * 10
            )

          )

        : 0;


      // 최종 결제금액

      const finalAmount =

        orderTotal - usedCash - couponAmount;


      // 결제수단

      const paymentMethods = [

        '신용카드',
        '휴대전화',
        '카카오페이',
        '네이버페이',
        '현장 결제'

      ];


      const paymentMethod = paymentMethods.includes(

        params.get('paymentMethod')

      )

        ? params.get('paymentMethod')

        : '미확인';


      // ========================================
      // 주문 정보 화면에 적용
      // ========================================

      document.getElementById('orderNumber').textContent =

        orderNumber;


      // 음식 이미지

      const orderImage = document.getElementById(
        'orderImage'
      );

      orderImage.style.backgroundImage =

        'url("' + selectedMenu.image + '")';


      orderImage.setAttribute(

        'aria-label',

        selectedMenu.name

      );


      // 음식 이름

      document.getElementById('orderName').textContent =

        selectedMenu.name;


      // 주문 수량

      document.getElementById('orderQuantity').textContent =

        '수량 ' + quantity + '개';


      // 음식 가격

      document.getElementById('orderProductPrice').textContent =

        formatPrice(selectedMenu.price * quantity);


      // 맵기 선택

      document.getElementById('orderSpicy').textContent =

        spicy;


      // 추가 토핑 표시

      const orderToppings = document.getElementById(
        'orderToppings'
      );


      if (selectedToppings.length === 0) {

        orderToppings.textContent = '추가 토핑 없음';

      } else {

        selectedToppings.forEach(function(topping) {

          const toppingName = document.createElement('p');

          toppingName.textContent = topping.name;

          orderToppings.appendChild(toppingName);

        });

      }


      // 결제수단 표시

      document.getElementById('paymentMethod').textContent =

        paymentMethod;


      // 총 주문금액

      document.getElementById('orderTotal').textContent =

        formatPrice(orderTotal);


      // 캐시 할인금액

      document.getElementById('cashDiscount').textContent =

        '- ' + formatPrice(usedCash);


      // 상품권 할인금액

      document.getElementById('couponDiscount').textContent =

        '- ' + formatPrice(couponAmount);


      // 최종 결제금액

      document.getElementById('finalPrice').textContent =

        formatPrice(finalAmount);


      // 현장 결제인 경우 안내 문구 변경

      if (paymentMethod === '현장 결제') {

        document.getElementById('finalPriceLabel').textContent =

          '현장 결제 예정금액';

      }

    } else {

      // ========================================
      // 주문 정보 없이 직접 접속한 경우
      // ========================================

      document.querySelector('.complete-title').textContent =
        '주문 정보가 없어요!';

      document.querySelector('.complete-description').textContent =
        '메뉴를 선택하고 주문을 진행해주세요.';

      document.querySelector('.complete-icon-area').hidden = true;

      document.querySelector('.delivery-section').hidden = true;

      document.querySelector('.order-section').hidden = true;

      document.querySelector('.price-section').hidden = true;

      document.querySelector('.demo-guide').hidden = true;

      document.getElementById('invalidOrder').hidden = false;

    }


    // Lucide 아이콘 실행

    if (window.lucide) {

      lucide.createIcons();

    }

  </script>

</body>
</html>
