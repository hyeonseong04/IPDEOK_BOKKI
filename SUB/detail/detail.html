
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>입덕볶이 - 메뉴 상세페이지</title>

  <!-- Noto Sans KR -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap">

  <!-- 외부 CSS -->
  <link rel="stylesheet" href="CSS/detail.css">

  <!-- Lucide 아이콘 -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <div class="container">

    <div class="page-content">

      <!-- ========================================
           HEADER
      ========================================= -->

      <header class="header">

        <a href="../list/list.html"
           class="back-btn"
           id="backBtn"
           aria-label="뒤로가기">

          <i data-lucide="chevron-left"></i>

        </a>

        <div class="logo">

          <img src="img/ChatGPT 이미지 2026년 11월 24일 오전 11_19_26-1.png"
               alt="입덕볶이 로고">

        </div>

        <button type="button"
                class="menu-btn"
                id="menuBtn"
                aria-label="메뉴 열기"
                aria-controls="sideMenu"
                aria-expanded="false">

          <i data-lucide="menu"></i>

        </button>

      </header>


      <main>

        <!-- ========================================
             SECTION 01 : 메뉴 이미지 및 정보
        ========================================= -->

        <section class="product-section">

          <div class="product-image-area">

            <div class="decoration decoration-1"></div>
            <div class="decoration decoration-2"></div>

            <div class="product-image"
                 id="productImage"
                 role="img"
                 aria-label="메뉴 이미지">
            </div>

          </div>


          <div class="product-info">

            <span class="best-label" id="productLabel">
              BEST
            </span>

            <div class="product-title-row">

              <h1 class="product-name" id="productName">
                입덕 시그니처 떡볶이
              </h1>

              <button type="button"
                      class="favorite-btn"
                      id="favoriteBtn"
                      aria-label="찜하기"
                      aria-pressed="false">

                <i data-lucide="heart"></i>

              </button>

            </div>

            <p class="product-price" id="productPrice">
              9,900원
            </p>

            <p class="product-description"
               id="productDescription">
            </p>

          </div>

        </section>


        <!-- ========================================
             SECTION 02 : 주문 옵션
        ========================================= -->

        <section class="option-section">

          <!-- 맵기 선택 : 떡볶이만 표시 -->

          <div class="option-card" id="spicyCard">

            <div class="option-title-row">

              <i data-lucide="flame"
                 class="option-icon"></i>

              <h2 class="option-title">
                맵기 선택
              </h2>

              <span class="required-label">
                필수
              </span>

            </div>

            <div class="spicy-options">

              <label class="spicy-btn">

                <input type="radio"
                       name="spicy"
                       value="순한맛"
                       checked>

                <span>순한맛</span>

              </label>

              <label class="spicy-btn">

                <input type="radio"
                       name="spicy"
                       value="보통맛">

                <span>보통맛</span>

              </label>

              <label class="spicy-btn">

                <input type="radio"
                       name="spicy"
                       value="매운맛">

                <span>매운맛</span>

              </label>

            </div>

          </div>


          <!-- 토핑 추가 : 떡볶이만 표시 -->

          <div class="option-card" id="toppingCard">

            <div class="option-title-row">

              <i data-lucide="circle-plus"
                 class="option-icon"></i>

              <h2 class="option-title">
                토핑 추가
              </h2>

              <span class="optional-label">
                선택
              </span>

            </div>

            <div class="topping-list">

              <label class="topping-item">

                <input type="checkbox"
                       class="topping-checkbox"
                       id="cheeseTopping"
                       value="2000">

                <span class="topping-name">
                  모짜렐라 치즈 추가
                </span>

                <span class="topping-price">
                  +2,000원
                </span>

              </label>

              <label class="topping-item">

                <input type="checkbox"
                       class="topping-checkbox"
                       value="1000">

                <span class="topping-name">
                  계란 추가
                </span>

                <span class="topping-price">
                  +1,000원
                </span>

              </label>

              <label class="topping-item">

                <input type="checkbox"
                       class="topping-checkbox"
                       value="1500">

                <span class="topping-name">
                  소시지 추가
                </span>

                <span class="topping-price">
                  +1,500원
                </span>

              </label>

              <label class="topping-item">

                <input type="checkbox"
                       class="topping-checkbox"
                       value="1000">

                <span class="topping-name">
                  어묵 추가
                </span>

                <span class="topping-price">
                  +1,000원
                </span>

              </label>

            </div>

          </div>


          <!-- ========================================
               수량 선택 : 모든 메뉴 공통
          ========================================= -->

          <div class="option-card quantity-card">

            <h2 class="option-title">
              수량
            </h2>

            <div class="quantity-control">

              <button type="button"
                      class="quantity-btn"
                      id="minusBtn"
                      aria-label="수량 감소"
                      disabled>

                <i data-lucide="minus"></i>

              </button>

              <span id="quantity" aria-live="polite">
                1
              </span>

              <button type="button"
                      class="quantity-btn"
                      id="plusBtn"
                      aria-label="수량 증가">

                <i data-lucide="plus"></i>

              </button>

            </div>

          </div>


          <!-- 총 주문금액 -->

          <div class="option-card total-card">

            <div class="total-price-row">

              <h2 class="option-title">
                총 주문금액
              </h2>

              <strong class="total-price"
                      id="totalPrice"
                      aria-live="polite">
              </strong>

            </div>

            <p class="price-description"
               id="priceDescription">
            </p>

          </div>

        </section>

      </main>

    </div>


    <!-- ========================================
         하단 주문하기 버튼
    ========================================= -->

    <div class="order-footer-frame">

      <div class="order-footer">

        <a href="../payment/payment.html"
           class="order-btn"
           id="orderBtn">

          <i data-lucide="shopping-cart"></i>

          <span>주문하기</span>

        </a>

      </div>

    </div>

  </div>


  <!-- ========================================
       햄버거 슬라이드 메뉴
  ========================================= -->

  <div class="menu-layer"
       id="menuLayer"
       aria-hidden="true"
       inert>

    <div class="menu-overlay"
         id="menuOverlay"></div>

    <aside class="side-menu"
           id="sideMenu"
           role="dialog"
           aria-modal="true"
           aria-label="페이지 이동 메뉴">

      <div class="side-menu-header">

        <button type="button"
                class="close-btn"
                id="closeBtn"
                aria-label="메뉴 닫기">

          <i data-lucide="x"></i>

        </button>

      </div>


      <!-- 로그인 사용자 프로필 -->

      <div class="user-profile"
           id="userProfile"
           hidden>

        <div class="profile-icon">

          <i data-lucide="user-round"></i>

        </div>

        <div class="profile-info">

          <p class="profile-name"
             id="profileName">
          </p>

          <p class="profile-message">

            오늘도 환영해요!

          </p>

        </div>

      </div>


      <nav class="side-menu-nav">

        <a href="../list/list.html">
          떡볶이 메뉴
        </a>

        <a href="../about/about.html">
          기업 소개
        </a>

        <a href="../community/community.html">
          커뮤니티
        </a>

        <a href="../login/login.html"
           id="authLink">

          로그인 / 회원가입

        </a>

      </nav>

    </aside>

  </div>


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script>

    const $ = selector =>
      document.querySelector(selector);

    const $$ = selector =>
      Array.from(document.querySelectorAll(selector));

    const reducedMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;


    // ========================================
    // 메뉴별 데이터 : 총 8개
    // ========================================

    const menuData = {

      // ======================================
      // 떡볶이 메뉴 4개
      // ======================================

      signature: {

        category: 'tteokbokki',

        name: '입덕 시그니처 떡볶이',

        price: 9900,

        image: 'img/시그니쳐.png',

        description:
          '쫄깃한 밀떡과 매콤달콤한 특제 소스가 어우러진 입덕볶이의 대표 시그니처 메뉴!'

      },

      cheese: {

        category: 'tteokbokki',

        name: '치즈폭탄 떡볶이',

        price: 11900,

        image: 'img/치즈폭탄.png',

        description:
          '매콤한 떡볶이에 고소한 모짜렐라 치즈가 듬뿍 올라간 입덕볶이의 인기 메뉴!'

      },

      rose: {

        category: 'tteokbokki',

        name: '로제 떡볶이',

        price: 11500,

        image: 'img/로제.png',

        description:
          '부드럽고 꾸덕한 로제 소스에 매콤함을 더한 떡볶이!'

      },

      crispy: {

        category: 'tteokbokki',

        name: '바삭토핑 떡볶이',

        price: 12500,

        image: 'img/바삭토핑.png',

        description:
          '바삭한 튀김 토핑과 매콤한 떡볶이가 어우러진 메뉴!'

      },


      // ======================================
      // 신규 사이드 메뉴 4개
      //
      // 기존 list/img 폴더 이미지 사용
      // ======================================

      gimmari: {

        category: 'side',

        name: '바삭 김말이',

        price: 2500,

        image: '../list/img/05_바삭_김말이.png',

        description:
          '바삭한 튀김옷 속에 쫄깃한 당면이 가득! 매콤한 떡볶이 소스에 찍어 먹으면 더욱 맛있어요.'

      },

      dumpling: {

        category: 'side',

        name: '바삭 군만두',

        price: 3000,

        image: '../list/img/06_바삭_군만두.png',

        description:
          '노릇노릇하고 바삭하게 튀겨낸 군만두. 떡볶이와 함께 즐기기 좋은 사이드 메뉴입니다.'

      },

      shrimp: {

        category: 'side',

        name: '통새우 튀김',

        price: 3500,

        image: '../list/img/07_통새우_튀김.png',

        description:
          '바삭한 튀김옷과 탱글한 통새우의 만남! 떡볶이와 함께 즐겨보세요.'

      },

      assorted: {

        category: 'side',

        name: '모둠 튀김',

        price: 5500,

        image: '../list/img/08_모둠_튀김.png',

        description:
          '김말이, 군만두, 새우튀김 등 다양한 튀김을 한 번에 즐길 수 있는 사이드 메뉴!'

      }

    };


    // ========================================
    // 선택한 메뉴 확인
    // ========================================

    const params = new URLSearchParams(
      window.location.search
    );

    const menuKey = params.get('menu');

    const selectedKey =
      Object.prototype.hasOwnProperty.call(
        menuData,
        menuKey
      )
        ? menuKey
        : 'cheese';

    const selectedMenu = menuData[selectedKey];

    const isSideMenu =
      selectedMenu.category === 'side';


    function formatPrice(price) {

      return price.toLocaleString('ko-KR') + '원';

    }


    // ========================================
    // 메뉴 이미지 및 정보 자동 적용
    // ========================================

    $('#productName').textContent =
      selectedMenu.name;

    $('#productPrice').textContent =
      formatPrice(selectedMenu.price);

    $('#productDescription').textContent =
      selectedMenu.description;

    $('#productImage').style.backgroundImage =
      'url("' + selectedMenu.image + '")';

    $('#productImage').style.backgroundSize =
      'contain';

    $('#productImage').style.backgroundPosition =
      'center';

    $('#productImage').style.backgroundRepeat =
      'no-repeat';

    $('#productImage').style.backgroundColor =
      'transparent';

    $('#productImage').setAttribute(
      'aria-label',
      selectedMenu.name
    );

    $('#productLabel').textContent =
      isSideMenu ? 'SIDE MENU' : 'BEST';

    document.title =
      '입덕볶이 - ' + selectedMenu.name;


    // ========================================
    // 튀김 메뉴 선택 시 맵기 / 토핑 숨기기
    // ========================================

    if (isSideMenu) {

      $('#spicyCard').hidden = true;
      $('#spicyCard').style.display = 'none';

      $('#toppingCard').hidden = true;
      $('#toppingCard').style.display = 'none';

    }


    // ========================================
    // 찜하기
    // ========================================

    const favoriteBtn = $('#favoriteBtn');

    favoriteBtn.addEventListener('click', () => {

      const isFavorite =
        favoriteBtn.classList.toggle('active');

      favoriteBtn.setAttribute(
        'aria-pressed',
        String(isFavorite)
      );

      favoriteBtn.setAttribute(
        'aria-label',
        isFavorite ? '찜하기 취소' : '찜하기'
      );

    });


    // ========================================
    // 주문 수량 및 옵션
    // ========================================

    const basePrice = selectedMenu.price;

    const toppingCheckboxes =
      $$('.topping-checkbox');

    const minusBtn = $('#minusBtn');

    const plusBtn = $('#plusBtn');

    const quantityText = $('#quantity');

    const totalPrice = $('#totalPrice');

    const priceDescription = $('#priceDescription');

    const maxQuantity =
      Math.floor(Number.MAX_SAFE_INTEGER / 20000);

    let quantity = 1;


    // 치즈폭탄 기존 기본 토핑 유지

    $('#cheeseTopping').checked =
      selectedKey === 'cheese';


    // 결제페이지에서 돌아왔을 경우 수량 복원

    const savedQuantity =
      Number(params.get('quantity'));

    if (
      Number.isSafeInteger(savedQuantity) &&
      savedQuantity > 0 &&
      savedQuantity <= maxQuantity
    ) {

      quantity = savedQuantity;

    }


    // 떡볶이 옵션 복원

    if (!isSideMenu) {

      const savedSpicy = params.get('spicy');

      if (
        ['순한맛', '보통맛', '매운맛']
          .includes(savedSpicy)
      ) {

        $$('input[name="spicy"]').forEach(input => {

          input.checked =
            input.value === savedSpicy;

        });

      }


      if (params.has('toppings')) {

        const savedToppings =
          params.get('toppings').split(',');

        toppingCheckboxes.forEach((checkbox, index) => {

          checkbox.checked =
            savedToppings.includes(String(index));

        });

      }

    } else {

      toppingCheckboxes.forEach(checkbox => {

        checkbox.checked = false;
        checkbox.disabled = true;

      });

    }


    // ========================================
    // 총 주문금액 자동 계산
    // ========================================

    function updatePrice() {

      let toppingTotal = 0;

      if (!isSideMenu) {

        toppingCheckboxes.forEach(checkbox => {

          if (checkbox.checked) {

            toppingTotal += Number(checkbox.value);

          }

        });

      }

      const total =
        (basePrice + toppingTotal) * quantity;


      quantityText.textContent = quantity;

      totalPrice.textContent =
        formatPrice(total);


      // 사이드 메뉴 금액 표시

      if (isSideMenu) {

        priceDescription.textContent =
          formatPrice(basePrice) +
          ' × ' + quantity + '개';

      } else {

        // 떡볶이 메뉴 금액 표시

        priceDescription.textContent =
          '(기본 ' + formatPrice(basePrice) +
          ' + 토핑 ' + formatPrice(toppingTotal) +
          ')' + (quantity > 1 ? ' × ' + quantity : '');

      }

      minusBtn.disabled = quantity <= 1;

      plusBtn.disabled = quantity >= maxQuantity;

    }


    // 수량 감소

    minusBtn.addEventListener('click', () => {

      if (quantity > 1) {

        quantity--;

        updatePrice();

      }

    });


    // 수량 증가

    plusBtn.addEventListener('click', () => {

      if (quantity < maxQuantity) {

        quantity++;

        updatePrice();

      }

    });


    // 토핑 변경

    toppingCheckboxes.forEach(checkbox => {

      checkbox.addEventListener(
        'change',
        updatePrice
      );

    });


    updatePrice();


    // ========================================
    // 결제페이지 연결
    // ========================================

    $('#orderBtn').addEventListener('click', event => {

      event.preventDefault();

      const selectedSpicy = isSideMenu

        ? '선택 없음'

        : $('input[name="spicy"]:checked').value;


      const selectedToppings = [];

      if (!isSideMenu) {

        toppingCheckboxes.forEach((checkbox, index) => {

          if (checkbox.checked) {

            selectedToppings.push(index);

          }

        });

      }


      // 기존 결제페이지로 주문 정보 전달

      const paymentParams = new URLSearchParams({

        menu: selectedKey,

        spicy: selectedSpicy,

        quantity: String(quantity),

        toppings: selectedToppings.join(',')

      });

      window.location.href =
        '../payment/payment.html?' +
        paymentParams.toString();

    });


    // ========================================
    // 임시 로그인 상태 및 사용자 정보
    // ========================================

    const authLink = $('#authLink');

    const userProfile = $('#userProfile');


    function getLoginState() {

      try {

        return sessionStorage.getItem(
          'demoLogin'
        ) === 'true';

      } catch (error) {

        return false;

      }

    }


    function updateLoginMenu() {

      let username = '입덕이';

      const loggedIn = getLoginState();

      if (loggedIn) {

        try {

          username =
            sessionStorage.getItem('demoUsername')
            || '입덕이';

        } catch (error) {

          username = '입덕이';

        }

        userProfile.hidden = false;

        userProfile.style.display = 'flex';

        $('#profileName').textContent =
          username + '님';

        authLink.textContent = '로그아웃';

        authLink.href = '#';

        authLink.classList.add('logout-link');

      } else {

        userProfile.hidden = true;

        userProfile.style.display = 'none';

        authLink.textContent =
          '로그인 / 회원가입';

        authLink.href = '../login/login.html';

        authLink.classList.remove('logout-link');

      }

    }


    // 로그아웃

    authLink.addEventListener('click', event => {

      if (!getLoginState()) return;

      event.preventDefault();

      event.stopImmediatePropagation();

      if (!confirm('로그아웃 하시겠습니까?')) return;

      try {

        sessionStorage.removeItem('demoLogin');

        sessionStorage.removeItem('demoUsername');

      } catch (error) {

        alert('로그아웃에 실패했습니다.');

        return;

      }

      updateLoginMenu();

      alert('로그아웃 되었습니다.');

    }, true);


    updateLoginMenu();


    // ========================================
    // 햄버거 슬라이드 메뉴
    // ========================================

    const menuBtn = $('#menuBtn');

    const closeBtn = $('#closeBtn');

    const menuLayer = $('#menuLayer');

    const menuOverlay = $('#menuOverlay');

    const container = $('.container');

    const menuLinks = $$('.side-menu-nav a');


    function openMenu() {

      updateLoginMenu();

      menuLayer.inert = false;

      menuLayer.classList.add('active');

      menuLayer.setAttribute(
        'aria-hidden',
        'false'
      );

      menuBtn.setAttribute(
        'aria-expanded',
        'true'
      );

      document.body.classList.add('menu-open');

      closeBtn.focus({ preventScroll: true });

      container.inert = true;

    }


    function closeMenu() {

      container.inert = false;

      menuBtn.focus({ preventScroll: true });

      menuLayer.classList.remove('active');

      menuLayer.inert = true;

      menuLayer.setAttribute(
        'aria-hidden',
        'true'
      );

      menuBtn.setAttribute(
        'aria-expanded',
        'false'
      );

      document.body.classList.remove('menu-open');

    }


    menuBtn.addEventListener('click', openMenu);

    closeBtn.addEventListener('click', closeMenu);

    menuOverlay.addEventListener('click', closeMenu);


    menuLinks.forEach(link => {

      link.addEventListener('click', closeMenu);

    });


    document.addEventListener('keydown', event => {

      if (!menuLayer.classList.contains('active')) return;

      if (event.key === 'Escape') {

        closeMenu();

      }

      if (event.key === 'Tab') {

        const lastLink =
          menuLinks[menuLinks.length - 1];

        if (
          event.shiftKey &&
          document.activeElement === closeBtn
        ) {

          event.preventDefault();

          lastLink.focus();

        } else if (
          !event.shiftKey &&
          document.activeElement === lastLink
        ) {

          event.preventDefault();

          closeBtn.focus();

        }

      }

    });


    // ========================================
    // 뒤로가기 슬라이드 애니메이션
    // ========================================

    const backBtn = $('#backBtn');

    const pageContent = $('.page-content');

    let isMoving = false;

    let moveTimer;


    function moveBack() {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(
        'transitionend',
        onTransitionEnd
      );

      window.location.href = backBtn.href;

    }


    function onTransitionEnd(event) {

      if (
        event.target === pageContent &&
        event.propertyName === 'transform'
      ) {

        moveBack();

      }

    }


    backBtn.addEventListener('click', event => {

      event.preventDefault();

      if (isMoving) return;

      isMoving = true;

      backBtn.classList.add('active');

      if (reducedMotion) {

        moveBack();

        return;

      }

      pageContent.addEventListener(
        'transitionend',
        onTransitionEnd
      );

      document.body.classList.add('page-leaving');

      moveTimer = setTimeout(moveBack, 450);

    });


    // ========================================
    // 브라우저 뒤로가기 시 초기화
    // ========================================

    window.addEventListener('pageshow', () => {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(
        'transitionend',
        onTransitionEnd
      );

      document.body.classList.remove('page-leaving');

      backBtn.classList.remove('active');

      isMoving = false;

      if (menuLayer.classList.contains('active')) {

        closeMenu();

      }

      updateLoginMenu();

      updatePrice();

    });


    // Lucide 아이콘 실행

    if (window.lucide) {

      lucide.createIcons();

    }

  </script>

</body>
</html>
