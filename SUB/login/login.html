
<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>입덕볶이 - 로그인 / 회원가입</title>

  <!-- Noto Sans KR -->

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap">

  <!-- 기존 로그인 CSS -->

  <link rel="stylesheet" href="CSS/login.css">

  <!-- 공통 회원 CSS -->

  <link rel="stylesheet" href="../../CSS/auth.css">

  <!-- 공통 회원 관리 기능 -->

  <script src="../../auth.js"></script>

  <!-- Lucide 아이콘 -->

  <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>

  <div class="container">

    <div class="page-content">


      <!-- ========================================
           HEADER
      ========================================= -->

      <header class="header">

        <!-- 뒤로가기 -->

        <a href="../../index.html"
           class="back-btn"
           id="backBtn"
           aria-label="뒤로가기">

          <i data-lucide="chevron-left"></i>

        </a>


        <!-- 중앙 로고 -->

        <div class="logo">

          <img src="img/logo.png"
               alt="입덕볶이 로고">

        </div>


        <!-- 햄버거 메뉴 -->

        <button type="button"
                class="menu-btn"
                id="menuBtn"
                aria-label="메뉴 열기"
                aria-controls="sideMenu"
                aria-expanded="false">

          <i data-lucide="menu"></i>

        </button>

      </header>


      <main>


        <!-- ========================================
             SECTION 01 : 로그인 / 회원가입 탭
        ========================================= -->

        <section class="tab-section">

          <div class="auth-tabs">

            <button type="button"
                    class="auth-tab active"
                    id="loginTab"
                    aria-pressed="true">

              로그인

            </button>


            <button type="button"
                    class="auth-tab"
                    id="signupTab"
                    aria-pressed="false">

              회원가입

            </button>

          </div>

        </section>


        <!-- ========================================
             SECTION 02 : 캐릭터 및 환영 문구
        ========================================= -->

        <section class="welcome-section">

          <div class="character-area">

            <!-- 로그인 캐릭터 -->

            <img src="img/login_character.png"
                 class="character-image"
                 id="loginCharacter"
                 alt="윙크하는 입덕볶이 캐릭터">


            <!-- 회원가입 캐릭터 -->

            <img src="img/signup_character.png"
                 class="character-image"
                 id="signupCharacter"
                 alt="환영하는 입덕볶이 캐릭터"
                 hidden>

          </div>


          <!-- 로그인 환영 문구 -->

          <div class="welcome-text"
               id="loginWelcome">

            <h1 class="welcome-title">

              <span>입덕볶이</span>에 오신 것을<br>
              환영해요 :)

            </h1>

            <p class="welcome-description">

              매콤한 즐거움을 지금 바로 시작해보세요!

            </p>

          </div>


          <!-- 회원가입 환영 문구 -->

          <div class="welcome-text"
               id="signupWelcome"
               hidden>

            <h1 class="welcome-title">

              <span>입덕볶이</span>와<br>
              함께해요!

            </h1>

            <p class="welcome-description">

              회원가입하고 더 많은 혜택을 만나보세요.

            </p>

          </div>

        </section>


        <!-- ========================================
             SECTION 03 : 간편 로그인
        ========================================= -->

        <section class="social-section">

          <!-- 카카오 -->

          <button type="button"
                  class="social-btn kakao-btn"
                  data-provider="카카오">

            <i data-lucide="message-circle"></i>

            <span>카카오로 시작하기</span>

          </button>


          <!-- 구글 -->

          <button type="button"
                  class="social-btn google-btn"
                  data-provider="구글">

            <span class="google-icon"
                  aria-hidden="true">G</span>

            <span>구글로 시작하기</span>

          </button>


          <!-- 애플 -->

          <button type="button"
                  class="social-btn apple-btn"
                  data-provider="애플">

            <i data-lucide="apple"></i>

            <span>애플로 시작하기</span>

          </button>


          <p class="social-guide">

            간편 로그인은 테스트용 기능입니다.

          </p>

        </section>


        <!-- 로그인 구분선 -->

        <div class="auth-divider">

          <span></span>

          <p id="dividerText">

            또는 아이디로 로그인

          </p>

          <span></span>

        </div>


        <!-- ========================================
             SECTION 04 : 일반 로그인
        ========================================= -->

        <section class="form-section"
                 id="loginSection">

          <form id="loginForm"
                class="auth-form"
                autocomplete="off"
                novalidate>


            <!-- 아이디 -->

            <div class="input-wrap">

              <i data-lucide="mail"
                 class="input-icon"></i>

              <input type="text"
                     id="loginEmail"
                     placeholder="아이디 또는 이메일을 입력하세요"
                     aria-label="아이디"
                     autocomplete="off">

            </div>


            <!-- 비밀번호 -->

            <div class="input-wrap password-wrap">

              <i data-lucide="lock-keyhole"
                 class="input-icon"></i>

              <input type="password"
                     id="loginPassword"
                     placeholder="비밀번호를 입력하세요"
                     aria-label="비밀번호"
                     autocomplete="off">

              <button type="button"
                      class="password-toggle"
                      data-target="loginPassword"
                      aria-label="비밀번호 보기">

                <i data-lucide="eye"></i>

              </button>

            </div>


            <!-- 로그인 상태 유지 -->

            <div class="login-options">

              <label class="check-label">

                <input type="checkbox"
                       id="rememberLogin"
                       checked
                       disabled>

                <span>로그인 상태 유지</span>

              </label>


              <button type="button"
                      class="find-password"
                      id="findPassword">

                비밀번호 찾기

              </button>

            </div>


            <!-- 오류 안내 -->

            <p class="form-error"
               id="loginError"
               aria-live="polite"></p>


            <!-- 로그인 버튼 -->

            <button type="submit"
                    class="primary-btn"
                    id="loginSubmit">

              로그인

            </button>


            <!-- 회원가입 화면 전환 -->

            <div class="auth-bottom">

              <span>아직 계정이 없으신가요?</span>

              <button type="button"
                      id="goSignup"
                      class="text-btn">

                회원가입하기

                <i data-lucide="chevron-right"></i>

              </button>

            </div>

          </form>

        </section>


        <!-- ========================================
             SECTION 05 : 회원가입
        ========================================= -->

        <section class="form-section"
                 id="signupSection"
                 hidden>

          <form id="signupForm"
                class="auth-form"
                autocomplete="off"
                novalidate>


            <!-- 아이디 -->

            <div class="input-wrap">

              <i data-lucide="mail"
                 class="input-icon"></i>

              <input type="text"
                     id="signupEmail"
                     placeholder="사용할 아이디를 입력하세요"
                     aria-label="가입 아이디"
                     autocomplete="off">

            </div>


            <!-- 비밀번호 -->

            <div class="input-wrap password-wrap">

              <i data-lucide="lock-keyhole"
                 class="input-icon"></i>

              <input type="password"
                     id="signupPassword"
                     placeholder="비밀번호를 입력하세요"
                     aria-label="가입 비밀번호"
                     autocomplete="new-password">

              <button type="button"
                      class="password-toggle"
                      data-target="signupPassword"
                      aria-label="비밀번호 보기">

                <i data-lucide="eye"></i>

              </button>

            </div>


            <!-- 비밀번호 확인 -->

            <div class="input-wrap password-wrap">

              <i data-lucide="lock-keyhole"
                 class="input-icon"></i>

              <input type="password"
                     id="confirmPassword"
                     placeholder="비밀번호를 다시 입력하세요"
                     aria-label="비밀번호 확인"
                     autocomplete="new-password">

              <button type="button"
                      class="password-toggle"
                      data-target="confirmPassword"
                      aria-label="비밀번호 보기">

                <i data-lucide="eye"></i>

              </button>

            </div>


            <!-- 닉네임 -->

            <div class="input-wrap">

              <i data-lucide="user-round"
                 class="input-icon"></i>

              <input type="text"
                     id="signupNickname"
                     maxlength="20"
                     placeholder="사용할 닉네임을 입력하세요"
                     aria-label="닉네임">

            </div>


            <!-- 오류 안내 -->

            <p class="form-error"
               id="signupError"
               aria-live="polite"></p>


            <!-- ========================================
                 약관 동의
            ========================================= -->

            <div class="agreement-section">


              <!-- 전체 동의 -->

              <label class="check-label agree-all">

                <input type="checkbox"
                       id="agreeAll">

                <span>모두 동의합니다.</span>

              </label>


              <div class="agreement-list">


                <!-- 이용약관 -->

                <div class="agreement-row">

                  <label class="check-label">

                    <input type="checkbox"
                           class="agreement-check"
                           id="agreeTerms">

                    <span>

                      이용약관에 동의합니다. (필수)

                    </span>

                  </label>

                  <button type="button"
                          class="terms-btn"
                          data-terms="terms"
                          aria-label="이용약관 보기">

                    <i data-lucide="chevron-right"></i>

                  </button>

                </div>


                <!-- 개인정보처리방침 -->

                <div class="agreement-row">

                  <label class="check-label">

                    <input type="checkbox"
                           class="agreement-check"
                           id="agreePrivacy">

                    <span>

                      개인정보처리방침에 동의합니다. (필수)

                    </span>

                  </label>

                  <button type="button"
                          class="terms-btn"
                          data-terms="privacy"
                          aria-label="개인정보처리방침 보기">

                    <i data-lucide="chevron-right"></i>

                  </button>

                </div>


                <!-- 마케팅 동의 -->

                <div class="agreement-row">

                  <label class="check-label">

                    <input type="checkbox"
                           class="agreement-check"
                           id="agreeMarketing">

                    <span>

                      이벤트 및 마케팅 정보 수신 동의 (선택)

                    </span>

                  </label>

                  <button type="button"
                          class="terms-btn"
                          data-terms="marketing"
                          aria-label="마케팅 정보 수신 안내">

                    <i data-lucide="chevron-right"></i>

                  </button>

                </div>

              </div>

            </div>


            <!-- 회원가입 버튼 -->

            <button type="submit"
                    class="primary-btn"
                    id="signupSubmit">

              회원가입

            </button>


            <!-- 로그인 전환 -->

            <div class="auth-bottom">

              <span>이미 계정이 있으신가요?</span>

              <button type="button"
                      class="text-btn"
                      id="goLogin">

                로그인하기

                <i data-lucide="chevron-right"></i>

              </button>

            </div>

          </form>

        </section>


        <!-- 테스트 안내 -->

        <p class="demo-guide">

          수업용 테스트 페이지입니다.<br>
          가상의 아이디와 비밀번호만 사용해 주세요.<br>
          로그인 상태는 로그아웃하기 전까지 유지됩니다.

        </p>

      </main>

    </div>

  </div>


  <!-- ========================================
       안내 팝업
  ========================================= -->

  <dialog class="notice-modal"
          id="noticeModal"
          aria-labelledby="noticeTitle">

    <div class="notice-header">

      <h2 id="noticeTitle">안내</h2>

      <button type="button"
              class="notice-close"
              id="noticeClose"
              aria-label="팝업 닫기">

        <i data-lucide="x"></i>

      </button>

    </div>


    <div class="notice-body">

      <div class="notice-icon">

        <i data-lucide="info"></i>

      </div>

      <p id="noticeText"></p>

      <button type="button"
              class="primary-btn"
              id="noticeConfirm">

        확인

      </button>

    </div>

  </dialog>


  <!-- ========================================
       햄버거 슬라이드 메뉴
  ========================================= -->

  <div class="menu-layer"
       id="menuLayer"
       aria-hidden="true"
       inert>

    <div class="menu-overlay"
         id="menuOverlay">
    </div>


    <aside class="side-menu"
           id="sideMenu"
           role="dialog"
           aria-modal="true"
           aria-label="페이지 이동 메뉴">

      <div class="side-menu-header">

        <button type="button"
                class="close-btn"
                id="closeBtn"
                aria-label="메뉴 닫기">

          <i data-lucide="x"></i>

        </button>

      </div>


      <!-- 사용자 프로필은 이후 헤더에서 표시 -->

      <nav class="side-menu-nav">

        <a href="../list/list.html">

          떡볶이 메뉴

        </a>

        <a href="../about/about.html">

          기업 소개

        </a>

        <a href="../community/community.html">

          커뮤니티

        </a>

        <a href="../login/login.html"
           id="authLink">

          로그인 / 회원가입

        </a>

      </nav>

    </aside>

  </div>


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script>

    const $ = selector =>
      document.querySelector(selector);

    const $$ = selector =>
      Array.from(document.querySelectorAll(selector));


    // ========================================
    // 공통 회원 기능 연결
    // ========================================

    const auth = window.IpAuth;

    if (!auth) {

      alert(
        'auth.js를 불러오지 못했습니다. ' +
        '파일 위치를 확인해 주세요.'
      );

      $('#loginSubmit').disabled = true;

      $('#signupSubmit').disabled = true;

      $$('.social-btn').forEach(button => {

        button.disabled = true;

      });

      throw new Error('auth.js not loaded');

    }


    // ========================================
    // Lucide 아이콘
    // ========================================

    function renderIcons() {

      if (window.lucide) {

        lucide.createIcons();

      }

    }

    renderIcons();


    // ========================================
    // 로그인 이후 이동할 페이지
    // ========================================

    const params = new URLSearchParams(

      window.location.search

    );


    // 장바구니에서 로그인 요청이 왔는지 확인

    const fromCheckout =

      params.get('next') === 'payment';


    // 결제 목적이면 뒤로가기 시 장바구니 이동

    if (fromCheckout) {

      $('#backBtn').href = '../cart/cart.html';

      $('#loginWelcome .welcome-description')
        .textContent =

        '주문을 계속하려면 먼저 로그인해 주세요.';

    }


    // 로그인 성공 후 이동

    function moveAfterLogin() {

      if (fromCheckout) {

        // 장바구니 정보 유지 후 결제페이지 이동

        location.href =

          '../payment/payment.html?source=cart';

      } else {

        // 일반 로그인은 메인페이지 이동

        location.href = '../../index.html';

      }

    }


    // ========================================
    // 로그인 / 회원가입 탭
    // ========================================

    const loginForm = $('#loginForm');

    const signupForm = $('#signupForm');

    let currentMode = 'login';

    let isWorking = false;


    // 처리 중 중복 클릭 방지

    function setWorking(value) {

      isWorking = value;

      $('#loginSubmit').disabled = value;

      $('#signupSubmit').disabled = value;

      $('#loginTab').disabled = value;

      $('#signupTab').disabled = value;

      $('#goSignup').disabled = value;

      $('#goLogin').disabled = value;

      $$('.social-btn').forEach(button => {

        button.disabled = value;

      });

    }


    // 비밀번호 초기화

    function resetPasswords() {

      $$('.password-toggle').forEach(button => {

        const input = document.getElementById(

          button.dataset.target

        );

        input.value = '';

        input.type = 'password';

        button.innerHTML =

          '<i data-lucide="eye"></i>';

        button.setAttribute(

          'aria-label',

          '비밀번호 보기'

        );

      });

      renderIcons();

    }


    // 로그인 / 회원가입 화면 전환

    function setMode(mode, scrollTop = false) {

      if (isWorking) return;

      if (currentMode !== mode) {

        resetPasswords();

      }

      currentMode = mode;

      const isLogin = mode === 'login';

      $('#loginTab').classList.toggle(

        'active',

        isLogin

      );

      $('#signupTab').classList.toggle(

        'active',

        !isLogin

      );

      $('#loginTab').setAttribute(

        'aria-pressed',

        String(isLogin)

      );

      $('#signupTab').setAttribute(

        'aria-pressed',

        String(!isLogin)

      );


      // 캐릭터 변경

      $('#loginCharacter').hidden = !isLogin;

      $('#signupCharacter').hidden = isLogin;


      // 환영 문구 변경

      $('#loginWelcome').hidden = !isLogin;

      $('#signupWelcome').hidden = isLogin;


      // 입력창 변경

      $('#loginSection').hidden = !isLogin;

      $('#signupSection').hidden = isLogin;


      // 구분선 문구 변경

      $('#dividerText').textContent = isLogin

        ? '또는 아이디로 로그인'

        : '또는 아이디로 회원가입';


      // 오류 안내 초기화

      $('#loginError').textContent = '';

      $('#signupError').textContent = '';


      if (scrollTop) {

        window.scrollTo({

          top: 0,

          behavior: 'smooth'

        });

      }

    }


    $('#loginTab').addEventListener('click', () => {

      setMode('login');

    });


    $('#signupTab').addEventListener('click', () => {

      setMode('signup');

    });


    $('#goSignup').addEventListener('click', () => {

      setMode('signup', true);

    });


    $('#goLogin').addEventListener('click', () => {

      setMode('login', true);

    });


    // ========================================
    // 비밀번호 보기 / 숨기기
    // ========================================

    $$('.password-toggle').forEach(button => {

      button.addEventListener('click', () => {

        const input = document.getElementById(

          button.dataset.target

        );

        const show = input.type === 'password';

        input.type = show ? 'text' : 'password';

        button.innerHTML = show

          ? '<i data-lucide="eye-off"></i>'

          : '<i data-lucide="eye"></i>';

        button.setAttribute(

          'aria-label',

          show ? '비밀번호 숨기기' : '비밀번호 보기'

        );

        renderIcons();

      });

    });


    // ========================================
    // 약관 전체 동의
    // ========================================

    const agreeAll = $('#agreeAll');

    const agreementChecks = $$('.agreement-check');


    function updateAgreement() {

      const allChecked = agreementChecks.every(

        check => check.checked

      );

      const someChecked = agreementChecks.some(

        check => check.checked

      );

      agreeAll.checked = allChecked;

      agreeAll.indeterminate =

        someChecked && !allChecked;

    }


    agreeAll.addEventListener('change', () => {

      agreementChecks.forEach(check => {

        check.checked = agreeAll.checked;

      });

      updateAgreement();

    });


    agreementChecks.forEach(check => {

      check.addEventListener(

        'change',

        updateAgreement

      );

    });


    // ========================================
    // 안내 팝업
    // ========================================

    const noticeModal = $('#noticeModal');

    let afterNotice = null;


    function showNotice(title, text, callback = null) {

      $('#noticeTitle').textContent = title;

      $('#noticeText').textContent = text;

      afterNotice = callback;

      noticeModal.showModal();

      document.body.classList.add('modal-open');

    }


    $('#noticeConfirm').addEventListener('click', () => {

      noticeModal.close();

    });


    $('#noticeClose').addEventListener('click', () => {

      noticeModal.close();

    });


    noticeModal.addEventListener('close', () => {

      document.body.classList.remove('modal-open');

      const callback = afterNotice;

      afterNotice = null;

      if (callback) {

        callback();

      }

    });


    // ========================================
    // 일반 회원가입
    // ========================================

    signupForm.addEventListener(

      'submit',

      async event => {

        event.preventDefault();

        if (isWorking) return;


        // 입력 정보 가져오기

        const id = $('#signupEmail').value.trim();

        const password = $('#signupPassword').value;

        const confirmPassword =

          $('#confirmPassword').value;

        const nickname =

          $('#signupNickname').value.trim();


        // 오류 안내 초기화

        $('#signupError').textContent = '';


        // 필수 정보 확인

        if (!id || !password || !nickname) {

          $('#signupError').textContent =

            '아이디, 비밀번호, 닉네임을 입력해 주세요.';

          return;

        }


        // 비밀번호 일치 확인

        if (password !== confirmPassword) {

          $('#signupError').textContent =

            '비밀번호가 일치하지 않습니다.';

          return;

        }


        // 필수 약관 동의 확인

        if (

          !$('#agreeTerms').checked ||

          !$('#agreePrivacy').checked

        ) {

          $('#signupError').textContent =

            '필수 약관에 동의해 주세요.';

          return;

        }


        setWorking(true);

        $('#signupSubmit').textContent =

          '가입 중...';


        try {


          // auth.js에 회원 정보 저장

          const user = await auth.register(

            id,

            password,

            nickname

          );


          // 회원가입 입력 정보 초기화

          signupForm.reset();

          resetPasswords();

          updateAgreement();


          // 회원가입 성공 안내

          showNotice(

            '회원가입 완료!',

            user.nickname +

            '님, 입덕볶이의 새로운 회원이 되신 것을 환영합니다!',

            () => {

              setMode('login', true);


              // 가입한 아이디 자동 입력

              $('#loginEmail').value = user.id;

              $('#loginPassword').focus();

            }

          );


        } catch (error) {


          // 중복 아이디 등 오류 안내

          $('#signupError').textContent =

            error.message ||

            '회원가입에 실패했습니다.';


        } finally {

          setWorking(false);

          $('#signupSubmit').textContent =

            '회원가입';

        }

      }

    );


    // ========================================
    // 일반 로그인
    // ========================================

    loginForm.addEventListener(

      'submit',

      async event => {

        event.preventDefault();

        if (isWorking) return;


        // 로그인 입력 정보 가져오기

        const id = $('#loginEmail').value.trim();

        const password = $('#loginPassword').value;

        $('#loginError').textContent = '';


        if (!id || !password) {

          $('#loginError').textContent =

            '아이디와 비밀번호를 입력해 주세요.';

          return;

        }


        setWorking(true);

        $('#loginSubmit').textContent =

          '로그인 중...';


        try {


          // 가입한 회원 정보와 비교

          const user = await auth.login(

            id,

            password

          );


          // 비밀번호 입력 정보 초기화

          resetPasswords();


          // 로그인 성공 안내

          showNotice(

            '로그인 완료!',

            user.nickname +

            '님, 입덕볶이에 오신 것을 환영합니다!',

            moveAfterLogin

          );


        } catch (error) {


          // 로그인 실패 안내

          $('#loginError').textContent =

            error.message ||

            '로그인에 실패했습니다.';


        } finally {

          setWorking(false);

          $('#loginSubmit').textContent =

            '로그인';

        }

      }

    );


    // ========================================
    // 카카오 / 구글 / 애플 테스트 로그인
    // ========================================

    $$('.social-btn').forEach(button => {

      button.addEventListener('click', () => {

        if (isWorking) return;

        const provider = button.dataset.provider;

        try {


          // 가상의 간편 로그인 계정 생성

          const user = auth.socialLogin(provider);

          resetPasswords();


          // 간편 로그인 성공

          showNotice(

            provider + ' 로그인 완료!',

            user.nickname +

            '님, 입덕볶이에 오신 것을 환영합니다!\n' +

            '실제 외부 계정 인증은 진행되지 않습니다.',

            moveAfterLogin

          );

        } catch (error) {

          showNotice(

            '로그인 실패',

            error.message

          );

        }

      });

    });


    // ========================================
    // 비밀번호 찾기
    // ========================================

    $('#findPassword').addEventListener('click', () => {

      showNotice(

        '비밀번호 찾기',

        '현재는 수업용 테스트 페이지입니다.\n' +

        '실제 비밀번호 재설정 기능은 제공하지 않습니다.'

      );

    });


    // ========================================
    // 약관 안내
    // ========================================

    const termsData = {

      terms: {

        title: '이용약관',

        text:

          '입덕볶이 수업용 웹사이트의 예시 이용약관입니다.\n' +

          '실제 서비스 이용 계약은 체결되지 않습니다.'

      },

      privacy: {

        title: '개인정보처리방침',

        text:

          '가상의 회원 정보는 현재 브라우저에 저장됩니다.\n' +

          '실제 개인정보나 사용 중인 비밀번호를 입력하지 마세요.'

      },

      marketing: {

        title: '마케팅 정보 수신 동의',

        text:

          '이벤트 및 신메뉴 소식을 받는 선택 항목입니다.\n' +

          '실제 메시지는 발송되지 않습니다.'

      }

    };


    $$('.terms-btn').forEach(button => {

      button.addEventListener('click', () => {

        const terms = termsData[button.dataset.terms];

        showNotice(terms.title, terms.text);

      });

    });


    // ========================================
    // 햄버거 슬라이드 메뉴
    // ========================================

    const menuBtn = $('#menuBtn');

    const closeBtn = $('#closeBtn');

    const menuLayer = $('#menuLayer');

    const menuOverlay = $('#menuOverlay');

    const container = $('.container');

    const menuLinks = $$('.side-menu-nav a');


    function openMenu() {

      menuLayer.inert = false;

      menuLayer.classList.add('active');

      menuLayer.setAttribute(

        'aria-hidden',

        'false'

      );

      menuBtn.setAttribute(

        'aria-expanded',

        'true'

      );

      document.body.classList.add('menu-open');

      closeBtn.focus({ preventScroll: true });

      container.inert = true;

    }


    function closeMenu() {

      container.inert = false;

      menuBtn.focus({ preventScroll: true });

      menuLayer.classList.remove('active');

      menuLayer.inert = true;

      menuLayer.setAttribute(

        'aria-hidden',

        'true'

      );

      menuBtn.setAttribute(

        'aria-expanded',

        'false'

      );

      document.body.classList.remove('menu-open');

    }


    menuBtn.addEventListener('click', openMenu);

    closeBtn.addEventListener('click', closeMenu);

    menuOverlay.addEventListener('click', closeMenu);


    menuLinks.forEach(link => {

      link.addEventListener('click', () => {

        closeMenu();

      });

    });


    // ESC 및 Tab 키 처리

    document.addEventListener('keydown', event => {

      if (!menuLayer.classList.contains('active')) {

        return;

      }

      if (event.key === 'Escape') {

        closeMenu();

      }

      if (event.key === 'Tab') {

        const lastLink =

          menuLinks[menuLinks.length - 1];

        if (

          event.shiftKey &&

          document.activeElement === closeBtn

        ) {

          event.preventDefault();

          lastLink.focus();

        } else if (

          !event.shiftKey &&

          document.activeElement === lastLink

        ) {

          event.preventDefault();

          closeBtn.focus();

        }

      }

    });


    // ========================================
    // 로그인 상태에 따른 메뉴 표시
    // ========================================

    const authLink = $('#authLink');


    function refreshAuthMenu() {

      const loggedIn = auth.isLoggedIn();

      authLink.textContent = loggedIn

        ? '로그아웃'

        : '로그인 / 회원가입';

      authLink.href = loggedIn

        ? '#'

        : '../login/login.html';

      authLink.classList.toggle(

        'logout-link',

        loggedIn

      );

    }


    // 로그아웃 기능

    authLink.addEventListener('click', event => {

      event.preventDefault();

      event.stopImmediatePropagation();

      if (!auth.isLoggedIn()) {

        closeMenu();

        setMode('login', true);

        return;

      }

      if (!confirm('로그아웃 하시겠습니까?')) {

        return;

      }

      try {

        auth.logout();

        refreshAuthMenu();

        closeMenu();

        showNotice(

          '로그아웃 완료',

          '정상적으로 로그아웃되었습니다.'

        );

      } catch (error) {

        alert('로그아웃에 실패했습니다.');

      }

    }, true);


    window.addEventListener(

      'ipdeok-auth',

      refreshAuthMenu

    );


    // ========================================
    // 뒤로가기 애니메이션
    // ========================================

    const backBtn = $('#backBtn');

    const pageContent = $('.page-content');

    let isMoving = false;

    let moveTimer;


    function moveBack() {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(

        'transitionend',

        onTransitionEnd

      );

      location.href = backBtn.href;

    }


    function onTransitionEnd(event) {

      if (

        event.target === pageContent &&

        event.propertyName === 'transform'

      ) {

        moveBack();

      }

    }


    backBtn.addEventListener('click', event => {

      event.preventDefault();

      if (isMoving || isWorking) return;

      isMoving = true;

      backBtn.classList.add('active');


      if (

        window.matchMedia(

          '(prefers-reduced-motion: reduce)'

        ).matches

      ) {

        moveBack();

        return;

      }


      pageContent.addEventListener(

        'transitionend',

        onTransitionEnd

      );

      document.body.classList.add('page-leaving');

      moveTimer = setTimeout(moveBack, 450);

    });


    // ========================================
    // 브라우저 뒤로가기 시 화면 초기화
    // ========================================

    window.addEventListener('pageshow', () => {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(

        'transitionend',

        onTransitionEnd

      );

      document.body.classList.remove('page-leaving');

      backBtn.classList.remove('active');

      isMoving = false;


      if (menuLayer.classList.contains('active')) {

        closeMenu();

      }


      if (noticeModal.open) {

        afterNotice = null;

        noticeModal.close();

      }


      document.body.classList.remove('modal-open');

      setWorking(false);

      resetPasswords();

      updateAgreement();

      refreshAuthMenu();

    });


    // ========================================
    // 최초 실행
    // ========================================

    refreshAuthMenu();

    updateAgreement();

  </script>

</body>
</html>
