
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>입덕볶이 - 주문결제</title>

  <!-- Noto Sans KR -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap">

  <!-- CSS 연결 -->
  <link rel="stylesheet" href="CSS/payment.css">

  <!-- Lucide 아이콘 -->
  <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

  <div class="container">

    <div class="page-content">

      <!-- ========================================
           HEADER
      ========================================= -->

      <header class="header">

        <a href="../detail/detail.html"
           class="back-btn"
           id="backBtn"
           aria-label="이전 페이지">

          <i data-lucide="chevron-left"></i>

        </a>

        <h1 class="header-title">주문결제</h1>

      </header>


      <main>

        <form id="paymentForm">

          <!-- ========================================
               SECTION 1
               주문자 정보
          ========================================= -->

          <section class="payment-section">

            <h2 class="section-title">
              주문자 정보
            </h2>

            <div class="section-content">

              <!-- 배달 주소 -->

              <div class="address-area">

                <label for="address" class="input-label">
                  배달 주소
                </label>

                <input type="text"
                       id="address"
                       class="text-input"
                       placeholder="배달받을 주소를 입력하세요"
                       required>

              </div>


              <!-- 상세 주소 -->

              <input type="text"
                     id="detailAddress"
                     class="text-input"
                     aria-label="상세 주소"
                     placeholder="상세 주소 (동, 호수)">


              <!-- 전화번호 -->

              <input type="tel"
                     id="phoneNumber"
                     class="text-input"
                     aria-label="전화번호"
                     placeholder="전화번호를 입력하세요"
                     required>


              <!-- 주문 요청사항 -->

              <div class="request-area">

                <h3 class="sub-title">
                  주문 요청사항
                </h3>

                <div class="select-wrap">

                  <select id="requestSelect"
                          class="text-input"
                          aria-label="주문 요청사항 선택">

                    <option value="">
                      요청사항을 선택해주세요
                    </option>

                    <option value="문 앞에 두고 문자주세요!">
                      문 앞에 두고 문자주세요!
                    </option>

                    <option value="도착하면 전화주세요!">
                      도착하면 전화주세요!
                    </option>

                    <option value="벨을 누르지 말아주세요!">
                      벨을 누르지 말아주세요!
                    </option>

                    <option value="direct">
                      직접 입력
                    </option>

                  </select>

                  <i data-lucide="chevron-down"></i>

                </div>

                <input type="text"
                       id="requestInput"
                       class="text-input"
                       aria-label="주문 요청사항 직접 입력"
                       placeholder="요청사항을 입력해주세요"
                       maxlength="100">

              </div>

            </div>

          </section>


          <!-- ========================================
               SECTION 2
               캐시 / 지역상품권
          ========================================= -->

          <section class="payment-section">

            <h2 class="section-title">
              캐시 / 지역상품권
            </h2>

            <div class="section-content">

              <!-- 보유 캐시 -->

              <div class="cash-card">

                <div class="cash-info-row">

                  <span class="cash-label">
                    보유캐시
                  </span>

                  <strong class="cash-balance"
                          id="cashBalance">
                    10,523원
                  </strong>

                  <button type="button"
                          class="small-btn"
                          id="checkCashBtn">
                    조회
                  </button>

                </div>


                <!-- 캐시 사용 -->

                <div class="cash-input-row">

                  <input type="number"
                         class="text-input"
                         id="cashInput"
                         min="0"
                         step="10"
                         aria-label="사용할 캐시 금액"
                         placeholder="사용할 금액">

                  <button type="button"
                          class="small-btn"
                          id="allCashBtn">
                    전체사용
                  </button>

                </div>

                <p class="cash-guide">
                  10캐시 단위로 사용 가능합니다.
                </p>

                <p class="demo-guide">
                  테스트용 보유 캐시입니다.
                </p>

              </div>


              <!-- 지역상품권 -->

              <div class="coupon-area">

                <div class="coupon-title">

                  <i data-lucide="ticket-percent"></i>

                  <h3 class="sub-title">
                    지역상품권
                  </h3>

                </div>

                <div class="coupon-input-row">

                  <input type="text"
                         class="text-input"
                         id="couponInput"
                         aria-label="상품권 코드"
                         placeholder="상품권 코드를 입력하세요">

                  <button type="button"
                          class="coupon-btn"
                          id="couponBtn">
                    사용하기
                  </button>

                </div>

                <p class="demo-guide">
                  테스트 코드 : TEST1000
                </p>

                <p class="coupon-message"
                   id="couponMessage"
                   aria-live="polite">
                </p>

              </div>

            </div>

          </section>


          <!-- ========================================
               SECTION 3
               결제 수단 선택
          ========================================= -->

          <section class="payment-section">

            <h2 class="section-title">
              결제 수단 선택
            </h2>

            <div class="section-content">

              <!-- 온라인 결제 -->

              <label class="payment-type">

                <input type="radio"
                       name="paymentType"
                       value="online"
                       checked>

                <span>온라인 결제</span>

              </label>


              <!-- 온라인 결제수단 -->

              <div class="payment-method-grid"
                   id="onlineMethods">

                <!-- 신용카드 -->

                <label class="payment-method">

                  <input type="radio"
                         name="paymentMethod"
                         value="신용카드"
                         checked>

                  <span>신용카드</span>

                </label>


                <!-- 휴대전화 -->

                <label class="payment-method">

                  <input type="radio"
                         name="paymentMethod"
                         value="휴대전화">

                  <span>휴대전화</span>

                </label>


                <!-- 카카오페이 -->

                <label class="payment-method">

                  <input type="radio"
                         name="paymentMethod"
                         value="카카오페이">

                  <span class="kakao-pay">

                    <i data-lucide="message-circle"></i>

                    pay

                  </span>

                </label>


                <!-- 네이버페이 -->

                <label class="payment-method">

                  <input type="radio"
                         name="paymentMethod"
                         value="네이버페이">

                  <span class="naver-pay">

                    <strong>N</strong>

                    Pay

                  </span>

                </label>

              </div>


              <!-- 현장 결제 -->

              <label class="payment-type offline-payment">

                <input type="radio"
                       name="paymentType"
                       value="offline">

                <span>

                  현장 결제

                  <small>
                    (음식 받고 직접 결제)
                  </small>

                </span>

              </label>

            </div>

          </section>


          <!-- ========================================
               SECTION 4
               배달 주문 내역
          ========================================= -->

          <section class="payment-section">

            <h2 class="section-title order-section-title">
              배달 주문 내역
            </h2>

            <div class="section-content">

              <!-- 주문 음식 정보 -->

              <div class="order-product">

                <div class="order-image"
                     id="orderImage"
                     role="img">
                </div>

                <div class="order-product-info">

                  <h3 id="orderName"></h3>

                  <p id="orderQuantity"></p>

                  <strong id="orderProductPrice"></strong>

                </div>

              </div>


              <!-- 주문 옵션 -->

              <div class="order-options">

                <div class="order-option-row">

                  <span>맵기 선택</span>

                  <span id="orderSpicy"></span>

                </div>

                <!-- 추가 토핑 자동 표시 -->

                <div id="orderToppings"></div>

              </div>

            </div>

          </section>


          <!-- ========================================
               SECTION 5
               최종 결제금액
          ========================================= -->

          <section class="payment-section total-section">

            <div class="section-content">

              <div class="price-row order-total-row">

                <span>총 주문금액</span>

                <strong id="orderTotal">0원</strong>

              </div>


              <div class="price-row">

                <span>캐시 사용금액</span>

                <span id="cashDiscount">- 0원</span>

              </div>


              <div class="price-row">

                <span>상품권 할인금액</span>

                <span id="couponDiscount">- 0원</span>

              </div>


              <!-- 최종 결제금액 -->

              <div class="final-price-row">

                <h2>최종 결제금액</h2>

                <strong id="finalPrice"
                        aria-live="polite">
                  0원
                </strong>

              </div>

              <p class="demo-guide">
                수업용 테스트 결제이며 실제 금액은 청구되지 않습니다.
              </p>

            </div>

          </section>

        </form>

      </main>

    </div>


    <!-- ========================================
         하단 고정 결제하기 버튼
    ========================================= -->

    <div class="payment-footer-frame">

      <div class="payment-footer">

        <button type="submit"
                form="paymentForm"
                class="pay-btn"
                id="payBtn">

          <i data-lucide="credit-card"></i>

          <span id="payBtnText">
            결제하기
          </span>

        </button>

      </div>

    </div>

  </div>


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script>

    // Lucide 아이콘 실행

    if (window.lucide) {
      lucide.createIcons();
    }


    // ========================================
    // 메뉴별 데이터
    // 기존 음식 이미지 경로 유지
    // ========================================

    const menuData = {

      signature: {

        name: '입덕 시그니처 떡볶이',

        price: 9900,

        image: '../detail/img/시그니쳐.png'

      },

      cheese: {

        name: '치즈폭탄 떡볶이',

        price: 11900,

        image: '../detail/img/치즈폭탄.png'

      },

      rose: {

        name: '로제 떡볶이',

        price: 11500,

        image: '../detail/img/로제.png'

      },

      crispy: {

        name: '바삭토핑 떡볶이',

        price: 12500,

        image: '../detail/img/바삭토핑.png'

      }

    };


// ========================================
// 사이드 메뉴 결제 데이터 추가
// ========================================

Object.assign(menuData, {

  gimmari: {

    name: '바삭 김말이',

    price: 2500,

    image: '../list/img/05_바삭_김말이.png'

  },

  dumpling: {

    name: '바삭 군만두',

    price: 3000,

    image: '../list/img/06_바삭_군만두.png'

  },

  shrimp: {

    name: '통새우 튀김',

    price: 3500,

    image: '../list/img/07_통새우_튀김.png'

  },

  assorted: {

    name: '모둠 튀김',

    price: 5500,

    image: '../list/img/08_모둠_튀김.png'

  }

});



    // ========================================
    // 토핑 정보
    // ========================================

    const toppingData = [

      {
        name: '모짜렐라 치즈 추가',
        price: 2000
      },

      {
        name: '계란 추가',
        price: 1000
      },

      {
        name: '소시지 추가',
        price: 1500
      },

      {
        name: '어묵 추가',
        price: 1000
      }

    ];


    // ========================================
    // 상세페이지 주문 정보 불러오기
    // ========================================

    const params = new URLSearchParams(
      window.location.search
    );

    const menuKey = params.get('menu');

    const selectedKey =
      Object.prototype.hasOwnProperty.call(menuData, menuKey)
      ? menuKey
      : 'cheese';

    const selectedMenu = menuData[selectedKey];


    // 주문 수량

    const receivedQuantity = Number(params.get('quantity'));

    const quantity =
      Number.isSafeInteger(receivedQuantity) &&
      receivedQuantity > 0 &&
      receivedQuantity <= Math.floor(Number.MAX_SAFE_INTEGER / 20000)

      ? receivedQuantity

      : 1;


    // 선택한 맵기

    const spicyOptions = [
      '순한맛',
      '보통맛',
      '매운맛'
    ];

    const spicy = spicyOptions.includes(params.get('spicy'))

      ? params.get('spicy')

      : '순한맛';


    // 선택한 토핑

    const toppingParam = params.get('toppings');

    const toppingIndexes = toppingParam === null

      ? (selectedKey === 'cheese' ? [0] : [])

      : [...new Set(

          toppingParam
            .split(',')
            .filter(value => /^[0-3]$/.test(value))
            .map(Number)

        )];


    const selectedToppings = toppingIndexes.map(
      index => toppingData[index]
    );


    // 토핑 가격 계산

    const toppingTotal = selectedToppings.reduce(

      (sum, topping) => sum + topping.price,

      0

    );


    // 총 주문금액

    const orderTotal =

      (selectedMenu.price + toppingTotal) * quantity;


    // 가격 쉼표 적용

    function formatPrice(price) {

      return price.toLocaleString('ko-KR') + '원';

    }


    // ========================================
    // 주문 음식 정보 화면에 표시
    // ========================================

    const orderImage = document.getElementById('orderImage');

    orderImage.style.backgroundImage =
      'url("' + selectedMenu.image + '")';

    orderImage.setAttribute(
      'aria-label',
      selectedMenu.name
    );


    document.getElementById('orderName').textContent =
      selectedMenu.name;


    document.getElementById('orderQuantity').textContent =
      '수량 ' + quantity + '개';


    document.getElementById('orderProductPrice').textContent =
      formatPrice(selectedMenu.price * quantity);


    document.getElementById('orderSpicy').textContent =
      spicy;


    document.getElementById('orderTotal').textContent =
      formatPrice(orderTotal);


    // ========================================
    // 추가 토핑 내역 자동 생성
    // ========================================

    const orderToppings = document.getElementById(
      'orderToppings'
    );


    if (selectedToppings.length === 0) {

      const row = document.createElement('div');

      row.className = 'order-option-row';

      row.textContent = '추가 토핑 없음';

      orderToppings.appendChild(row);

    } else {

      selectedToppings.forEach(function(topping) {

        const row = document.createElement('div');

        row.className = 'order-option-row';

        const name = document.createElement('span');

        const price = document.createElement('span');

        name.textContent = topping.name;

        price.textContent =
          '+ ' + formatPrice(topping.price * quantity);

        row.appendChild(name);

        row.appendChild(price);

        orderToppings.appendChild(row);

      });

    }


    // ========================================
    // 주문 요청사항
    // ========================================

    const requestSelect = document.getElementById(
      'requestSelect'
    );

    const requestInput = document.getElementById(
      'requestInput'
    );


    requestSelect.addEventListener('change', function() {

      if (requestSelect.value === 'direct') {

        requestInput.value = '';

        requestInput.focus();

      } else {

        requestInput.value = requestSelect.value;

      }

    });


    // ========================================
    // 캐시 및 지역상품권
    // ========================================

    const availableCash = 10523;

    let usedCash = 0;

    let couponAmount = 0;


    const cashInput = document.getElementById('cashInput');

    const allCashBtn = document.getElementById('allCashBtn');

    const checkCashBtn = document.getElementById('checkCashBtn');

    const couponInput = document.getElementById('couponInput');

    const couponBtn = document.getElementById('couponBtn');

    const couponMessage = document.getElementById('couponMessage');


    // 최대 사용 가능한 캐시

    function getMaxCash() {

      return Math.floor(

        Math.min(

          availableCash,

          Math.max(0, orderTotal - couponAmount)

        ) / 10

      ) * 10;

    }


    // ========================================
    // 최종 결제금액 자동 계산
    // ========================================

    function updatePayment(syncInput = true) {

      usedCash = Math.min(

        usedCash,

        getMaxCash()

      );


      const finalAmount = Math.max(

        0,

        orderTotal - usedCash - couponAmount

      );


      cashInput.max = getMaxCash();


      if (syncInput) {

        cashInput.value = usedCash || '';

      }


      document.getElementById('cashDiscount').textContent =

        '- ' + formatPrice(usedCash);


      document.getElementById('couponDiscount').textContent =

        '- ' + formatPrice(couponAmount);


      document.getElementById('finalPrice').textContent =

        formatPrice(finalAmount);


      document.getElementById('payBtnText').textContent =

        formatPrice(finalAmount) + ' 결제하기';


      return finalAmount;

    }


    // 캐시 조회

    checkCashBtn.addEventListener('click', function() {

      alert(

        '테스트용 보유 캐시: ' +

        formatPrice(availableCash)

      );

    });


    // 캐시 전체사용

    allCashBtn.addEventListener('click', function() {

      usedCash = getMaxCash();

      updatePayment();

    });


    // 캐시 직접 입력

    cashInput.addEventListener('input', function() {

      const enteredCash = Number(cashInput.value) || 0;

      usedCash = Math.min(

        getMaxCash(),

        Math.max(

          0,

          Math.floor(enteredCash / 10) * 10

        )

      );

      updatePayment(false);

    });


    cashInput.addEventListener('change', function() {

      updatePayment();

    });


    // ========================================
    // 상품권 사용 및 취소
    // ========================================

    couponBtn.addEventListener('click', function() {

      if (couponAmount > 0) {

        couponAmount = 0;

        couponInput.disabled = false;

        couponBtn.textContent = '사용하기';

        couponMessage.textContent =
          '상품권 사용이 취소되었습니다.';

        couponMessage.classList.remove('error');

        updatePayment();

        return;

      }


      if (

        couponInput.value.trim().toUpperCase() === 'TEST1000'

      ) {

        couponAmount = Math.min(1000, orderTotal);

        couponMessage.textContent =
          '1,000원 테스트 할인이 적용되었습니다.';

        couponMessage.classList.remove('error');

        couponInput.disabled = true;

        couponBtn.textContent = '취소하기';

      } else {

        couponMessage.textContent =
          '유효한 테스트 상품권 코드를 입력해주세요.';

        couponMessage.classList.add('error');

      }

      updatePayment();

    });


    // ========================================
    // 결제 수단 선택
    // ========================================

    const paymentTypes = document.querySelectorAll(
      'input[name="paymentType"]'
    );

    const paymentMethods = document.querySelectorAll(
      'input[name="paymentMethod"]'
    );

    const onlineMethods = document.getElementById(
      'onlineMethods'
    );


    function updatePaymentType() {

      const isOffline = document.querySelector(

        'input[name="paymentType"]:checked'

      ).value === 'offline';


      onlineMethods.classList.toggle(

        'disabled',

        isOffline

      );


      paymentMethods.forEach(function(method) {

        method.disabled = isOffline;

      });

    }


    paymentTypes.forEach(function(type) {

      type.addEventListener(

        'change',

        updatePaymentType

      );

    });


    updatePaymentType();


    // ========================================
    // 이전 페이지 슬라이드
    // ========================================

    const backBtn = document.getElementById('backBtn');

    const pageContent = document.querySelector('.page-content');

    let isMoving = false;

    let moveTimer;


    // 기존 주문 옵션 유지

    const backParams = new URLSearchParams({

      menu: selectedKey,

      quantity: String(quantity),

      spicy: spicy,

      toppings: toppingIndexes.join(',')

    });


    // 상세페이지 연결

    backBtn.href =

      '../detail/detail.html?' +

      backParams.toString();


    function moveBack() {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(

        'transitionend',

        onTransitionEnd

      );

      window.location.href = backBtn.href;

    }


    function onTransitionEnd(event) {

      if (

        event.target === pageContent &&

        event.propertyName === 'transform'

      ) {

        moveBack();

      }

    }


    backBtn.addEventListener('click', function(event) {

      event.preventDefault();

      if (isMoving) return;

      isMoving = true;

      backBtn.classList.add('active');


      if (

        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches

      ) {

        moveBack();

        return;

      }


      pageContent.addEventListener(

        'transitionend',

        onTransitionEnd

      );


      document.body.classList.add('page-leaving');

      moveTimer = setTimeout(moveBack, 450);

    });


    // ========================================
    // 결제완료 페이지 연결
    // payment_finish.html
    // ========================================

    const paymentForm = document.getElementById(
      'paymentForm'
    );

    const payBtn = document.getElementById('payBtn');

    let isSubmitting = false;


    paymentForm.addEventListener('submit', function(event) {

      event.preventDefault();


      // 중복 주문 방지

      if (isSubmitting) return;


      // 주문자 정보 확인

      const address = document.getElementById('address');

      const phoneNumber = document.getElementById('phoneNumber');


      if (!address.value.trim()) {

        alert('배달 주소를 입력해주세요.');

        address.focus();

        return;

      }


      if (!phoneNumber.value.trim()) {

        alert('전화번호를 입력해주세요.');

        phoneNumber.focus();

        return;

      }


      // 최종 결제금액

      const finalAmount = updatePayment();


      // 선택한 결제 방식

      const paymentType = document.querySelector(

        'input[name="paymentType"]:checked'

      ).value;


      // 선택한 결제수단

      const paymentMethod = paymentType === 'offline'

        ? '현장 결제'

        : document.querySelector(

            'input[name="paymentMethod"]:checked'

          ).value;


      // 테스트 주문번호 생성

      const orderNumber = 'IP-' + Date.now();


      // 결제완료 페이지로 주문 정보 전달

      const completeParams = new URLSearchParams({

        orderNumber: orderNumber,

        menu: selectedKey,

        quantity: String(quantity),

        spicy: spicy,

        toppings: toppingIndexes.join(','),

        orderTotal: String(orderTotal),

        cash: String(usedCash),

        coupon: String(couponAmount),

        finalPrice: String(finalAmount),

        paymentMethod: paymentMethod

      });


      // 중복 결제 방지

      isSubmitting = true;

      payBtn.disabled = true;


      // ========================================
      // 결제완료 페이지 이동 경로
      // ========================================

      window.location.href =

        '../payment_finish/payment_finish.html?' +

        completeParams.toString();

    });


    // ========================================
    // 브라우저 뒤로 가기 시 초기화
    // ========================================

    window.addEventListener('pageshow', function() {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(

        'transitionend',

        onTransitionEnd

      );

      document.body.classList.remove('page-leaving');

      backBtn.classList.remove('active');

      isMoving = false;

      isSubmitting = false;

      payBtn.disabled = false;

      updatePaymentType();

      updatePayment();

    });


    // 초기 결제금액 표시

    updatePayment();

    // 튀김 결제 시 맵기 내역 숨기기

const sideMenuKeys = [
  'gimmari',
  'dumpling',
  'shrimp',
  'assorted'
];

if (sideMenuKeys.includes(selectedKey)) {

  const spicyRow = document
    .getElementById('orderSpicy')
    ?.closest('.order-option-row');

  if (spicyRow) {

    spicyRow.style.display = 'none';

  }

}

  </script>
