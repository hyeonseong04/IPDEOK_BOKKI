
<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>입덕볶이 - 주문 상세페이지</title>

  <!-- Noto Sans KR -->

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap">

  <!-- 기존 상세페이지 CSS -->

  <link rel="stylesheet" href="CSS/detail.css">

  <!-- 공통 주문 CSS -->

  <link rel="stylesheet" href="../../CSS/order.css">

  <!-- 공통 장바구니 기능 -->

  <script src="../../order.js"></script>

  <!-- Lucide 아이콘 -->

  <script src="https://unpkg.com/lucide@latest"></script>


  <!-- 장바구니 버튼 전체 너비 적용 -->

  <style>

    .order-footer .detail-order-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      width: 100%;
    }

    .order-footer .detail-order-actions button {
      width: 100%;
      border: none;
      font-family: inherit;
      cursor: pointer;
    }

  </style>

  <script src="../../auth.js" defer></script>

</head>


<body>

  <div class="container">

    <div class="page-content">


      <!-- ========================================
           HEADER
      ========================================= -->

      <header class="header">

        <!-- 뒤로가기 -->

        <a href="../list/list.html"
           class="back-btn"
           id="backBtn"
           aria-label="메뉴 리스트로 돌아가기">

          <i data-lucide="chevron-left"></i>

        </a>


        <!-- 중앙 로고 -->

        <div class="logo">

          <img src="../../IMG/ChatGPT 이미지 2026년 11월 24일 오전 11_19_26-1.png"
               alt="입덕볶이 로고">

        </div>


        <!-- 햄버거 메뉴 -->

        <button class="menu-btn"
                id="menuBtn"
                type="button"
                aria-label="메뉴 열기"
                aria-controls="sideMenu"
                aria-expanded="false">

          <i data-lucide="menu"></i>

        </button>

      </header>


      <main>


        <!-- ========================================
             SECTION 01
             음식 이미지 및 기본 정보
        ========================================= -->

        <section class="product-section">

          <div class="product-image-area">

            <div class="decoration decoration-1"></div>

            <div class="decoration decoration-2"></div>

            <div class="product-image"
                 id="productImage"
                 role="img"
                 aria-label="치즈폭탄 떡볶이">

            </div>

          </div>


          <!-- 음식 정보 -->

          <div class="product-info">

            <span class="best-label">BEST</span>


            <div class="product-title-row">

              <h1 class="product-name"
                  id="productName">

                치즈폭탄 떡볶이

              </h1>


              <!-- 찜하기 -->

              <button class="favorite-btn"
                      id="favoriteBtn"
                      type="button"
                      aria-label="찜하기"
                      aria-pressed="false">

                <i data-lucide="heart"></i>

              </button>

            </div>


            <!-- 메뉴 가격 -->

            <p class="product-price"
               id="productPrice">

              11,900원

            </p>


            <!-- 메뉴 설명 -->

            <p class="product-description"
               id="productDescription">

              매콤한 떡볶이에 고소한 모짜렐라 치즈가
              듬뿍 올라간 입덕볶이의 인기 메뉴!

            </p>

          </div>

        </section>


        <!-- ========================================
             SECTION 02
             주문 옵션
        ========================================= -->

        <section class="option-section">


          <!-- ========================================
               맵기 선택
               떡볶이 메뉴에서만 표시
          ========================================= -->

          <div class="option-card"
               id="spicyCard">

            <div class="option-title-row">

              <i data-lucide="flame"
                 class="option-icon"></i>

              <h2 class="option-title">
                맵기 선택
              </h2>

              <span class="required-label">
                필수
              </span>

            </div>


            <div class="spicy-options">

              <!-- 순한맛 -->

              <label class="spicy-btn">

                <input type="radio"
                       name="spicy"
                       value="순한맛"
                       checked>

                <span>순한맛</span>

              </label>


              <!-- 보통맛 -->

              <label class="spicy-btn">

                <input type="radio"
                       name="spicy"
                       value="보통맛">

                <span>보통맛</span>

              </label>


              <!-- 매운맛 -->

              <label class="spicy-btn">

                <input type="radio"
                       name="spicy"
                       value="매운맛">

                <span>매운맛</span>

              </label>

            </div>

          </div>


          <!-- ========================================
               토핑 추가
               떡볶이 메뉴에서만 표시
          ========================================= -->

          <div class="option-card"
               id="toppingCard">

            <div class="option-title-row">

              <i data-lucide="circle-plus"
                 class="option-icon"></i>

              <h2 class="option-title">
                토핑 추가
              </h2>

              <span class="optional-label">
                선택
              </span>

            </div>


            <div class="topping-list">


              <!-- 모짜렐라 치즈 -->

              <label class="topping-item">

                <input type="checkbox"
                       class="topping-checkbox"
                       id="cheeseTopping"
                       value="2000">

                <span class="topping-name">
                  모짜렐라 치즈 추가
                </span>

                <span class="topping-price">
                  +2,000원
                </span>

              </label>


              <!-- 계란 -->

              <label class="topping-item">

                <input type="checkbox"
                       class="topping-checkbox"
                       value="1000">

                <span class="topping-name">
                  계란 추가
                </span>

                <span class="topping-price">
                  +1,000원
                </span>

              </label>


              <!-- 소시지 -->

              <label class="topping-item">

                <input type="checkbox"
                       class="topping-checkbox"
                       value="1500">

                <span class="topping-name">
                  소시지 추가
                </span>

                <span class="topping-price">
                  +1,500원
                </span>

              </label>


              <!-- 어묵 -->

              <label class="topping-item">

                <input type="checkbox"
                       class="topping-checkbox"
                       value="1000">

                <span class="topping-name">
                  어묵 추가
                </span>

                <span class="topping-price">
                  +1,000원
                </span>

              </label>

            </div>

          </div>


          <!-- ========================================
               수량 선택
          ========================================= -->

          <div class="option-card quantity-card">

            <h2 class="option-title">
              수량
            </h2>

            <div class="quantity-control">


              <!-- 수량 감소 -->

              <button class="quantity-btn"
                      id="minusBtn"
                      type="button"
                      aria-label="수량 감소"
                      disabled>

                <i data-lucide="minus"></i>

              </button>


              <!-- 현재 수량 -->

              <span id="quantity"
                    aria-live="polite">

                1

              </span>


              <!-- 수량 증가 -->

              <button class="quantity-btn"
                      id="plusBtn"
                      type="button"
                      aria-label="수량 증가">

                <i data-lucide="plus"></i>

              </button>

            </div>

          </div>


          <!-- ========================================
               총 주문금액
          ========================================= -->

          <div class="option-card total-card">

            <div class="total-price-row">

              <h2 class="option-title">
                총 주문금액
              </h2>

              <strong class="total-price"
                      id="totalPrice"
                      aria-live="polite">

                11,900원

              </strong>

            </div>

            <p class="price-description"
               id="priceDescription">

              (기본 11,900원 + 토핑 0원)

            </p>

          </div>

        </section>

      </main>

    </div>


    <!-- ========================================
         하단 고정 장바구니 버튼

         담고 결제하기 버튼 삭제
         장바구니 담기 버튼만 사용
    ========================================= -->

    <div class="order-footer-frame">

      <div class="order-footer">

        <div class="detail-order-actions">

          <button type="button"
                  class="order-primary-btn"
                  id="addCartBtn">

            <i data-lucide="shopping-cart"></i>

            장바구니 담기

          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- ========================================
       햄버거 슬라이드 메뉴
  ========================================= -->

  <div class="menu-layer"
       id="menuLayer"
       aria-hidden="true"
       inert>


    <!-- 어두운 배경 -->

    <div class="menu-overlay"
         id="menuOverlay">

    </div>


    <!-- 사이드 메뉴 -->

    <aside class="side-menu"
           id="sideMenu"
           role="dialog"
           aria-modal="true"
           aria-label="페이지 이동 메뉴">


      <!-- 메뉴 닫기 -->

      <div class="side-menu-header">

        <button class="close-btn"
                id="closeBtn"
                type="button"
                aria-label="메뉴 닫기">

          <i data-lucide="x"></i>

        </button>

      </div>


      <!-- 로그인 프로필은 order.js에서 자동 생성 -->


      <!-- 메뉴 목록 -->

      <nav class="side-menu-nav">

        <a href="../list/list.html">

          떡볶이 메뉴

        </a>

        <a href="../about/about.html">

          기업 소개

        </a>

        <a href="../community/community.html">

          커뮤니티

        </a>

        <a href="../login/login.html">

          로그인 / 회원가입

        </a>

      </nav>

    </aside>

  </div>


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script>


    // ========================================
    // Lucide 아이콘 실행
    // ========================================

    if (window.lucide) {

      lucide.createIcons();

    }


    // ========================================
    // 공통 장바구니 기능 확인
    // ========================================

    if (!window.IpOrder) {

      document.getElementById('addCartBtn')
        .disabled = true;

      alert(
        'order.js를 불러오지 못했습니다. ' +
        '파일 위치를 확인해 주세요.'
      );

      throw new Error('order.js not loaded');

    }


    // ========================================
    // 전체 메뉴 정보 가져오기
    // ========================================

    const menuData = IpOrder.catalog;


    // 선택한 메뉴 확인

    const params = new URLSearchParams(
      window.location.search
    );

    const menuKey = params.get('menu');


    // 메뉴 정보가 없을 경우 치즈폭탄 표시

    const selectedKey =
      Object.prototype.hasOwnProperty.call(
        menuData,
        menuKey
      ) ? menuKey : 'cheese';


    const selectedMenu = menuData[selectedKey];


    // ========================================
    // 가격 표시 형식
    // ========================================

    function formatPrice(price) {

      return price.toLocaleString('ko-KR') + '원';

    }


    // ========================================
    // HTML 요소 가져오기
    // ========================================

    const productImage =
      document.getElementById('productImage');

    const productName =
      document.getElementById('productName');

    const productPrice =
      document.getElementById('productPrice');

    const productDescription =
      document.getElementById('productDescription');


    // ========================================
    // 메뉴별 정보 자동 변경
    // ========================================

    productName.textContent =
      selectedMenu.name;

    productPrice.textContent =
      formatPrice(selectedMenu.price);

    productDescription.textContent =
      selectedMenu.description;


    // 음식 이미지 변경

    productImage.style.backgroundImage =

      'url("' + IpOrder.url(selectedMenu.image) + '")';

    productImage.style.backgroundSize =
      'contain';

    productImage.style.backgroundPosition =
      'center';

    productImage.style.backgroundRepeat =
      'no-repeat';

    productImage.setAttribute(
      'aria-label',
      selectedMenu.name
    );

    document.title =
      '입덕볶이 - ' + selectedMenu.name;


    // ========================================
    // 사이드 메뉴 구분
    // ========================================

    const isSide = !!selectedMenu.side;


    // 튀김은 맵기 및 토핑 선택 숨기기

    if (isSide) {

      document.querySelector('.best-label')
        .textContent = 'SIDE MENU';

      ['spicyCard', 'toppingCard']
        .forEach(id => {

          const card =
            document.getElementById(id);

          card.hidden = true;

          card.style.display = 'none';

        });

    }


    // ========================================
    // 햄버거 메뉴
    // ========================================

    const menuBtn =
      document.getElementById('menuBtn');

    const closeBtn =
      document.getElementById('closeBtn');

    const menuLayer =
      document.getElementById('menuLayer');

    const menuOverlay =
      document.getElementById('menuOverlay');

    const container =
      document.querySelector('.container');

    const menuLinks =
      document.querySelectorAll('.side-menu-nav a');


    // 메뉴 열기

    function openMenu() {

      menuLayer.classList.add('active');

      menuLayer.inert = false;

      menuLayer.setAttribute(
        'aria-hidden',
        'false'
      );

      menuBtn.setAttribute(
        'aria-expanded',
        'true'
      );

      document.body.classList.add('menu-open');

      closeBtn.focus({
        preventScroll: true
      });

      container.inert = true;

    }


    // 메뉴 닫기

    function closeMenu() {

      container.inert = false;

      menuBtn.focus({
        preventScroll: true
      });

      menuLayer.classList.remove('active');

      menuLayer.inert = true;

      menuLayer.setAttribute(
        'aria-hidden',
        'true'
      );

      menuBtn.setAttribute(
        'aria-expanded',
        'false'
      );

      document.body.classList.remove('menu-open');

    }


    menuBtn.addEventListener(
      'click',
      openMenu
    );

    closeBtn.addEventListener(
      'click',
      closeMenu
    );

    menuOverlay.addEventListener(
      'click',
      closeMenu
    );


    // 메뉴 클릭 시 닫기

    menuLinks.forEach(function(link) {

      link.addEventListener('click', function(event) {

        if (link.getAttribute('href') === '#') {

          event.preventDefault();

        }

        closeMenu();

      });

    });


    // ========================================
    // ESC 및 Tab 키 처리
    // ========================================

    document.addEventListener('keydown', function(event) {

      if (!menuLayer.classList.contains('active')) {

        return;

      }

      if (event.key === 'Escape') {

        closeMenu();

      }

      if (event.key === 'Tab') {

        const lastLink =
          menuLinks[menuLinks.length - 1];

        if (

          event.shiftKey &&
          document.activeElement === closeBtn

        ) {

          event.preventDefault();

          lastLink.focus();

        } else if (

          !event.shiftKey &&
          document.activeElement === lastLink

        ) {

          event.preventDefault();

          closeBtn.focus();

        }

      }

    });


    // ========================================
    // 뒤로가기 슬라이드 애니메이션
    // ========================================

    const backBtn =
      document.getElementById('backBtn');

    const pageContent =
      document.querySelector('.page-content');

    let isMoving = false;

    let moveTimer;


    function moveBack() {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(
        'transitionend',
        onTransitionEnd
      );

      window.location.href =
        backBtn.getAttribute('href');

    }


    function onTransitionEnd(event) {

      if (

        event.target === pageContent &&
        event.propertyName === 'transform'

      ) {

        moveBack();

      }

    }


    backBtn.addEventListener('click', function(event) {

      event.preventDefault();

      if (isMoving) return;

      isMoving = true;

      backBtn.classList.add('active');

      if (

        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches

      ) {

        moveBack();

        return;

      }

      pageContent.addEventListener(
        'transitionend',
        onTransitionEnd
      );

      document.body.classList.add('page-leaving');

      moveTimer = setTimeout(moveBack, 450);

    });


    // ========================================
    // 브라우저 뒤로가기 시 초기화
    // ========================================

    window.addEventListener('pageshow', function() {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(
        'transitionend',
        onTransitionEnd
      );

      document.body.classList.remove('page-leaving');

      backBtn.classList.remove('active');

      isMoving = false;

      if (menuLayer.classList.contains('active')) {

        closeMenu();

      }

      updatePrice();

    });


    // ========================================
    // 찜하기 기능
    // ========================================

    const favoriteBtn =
      document.getElementById('favoriteBtn');

    favoriteBtn.addEventListener('click', function() {

      const isFavorite =
        favoriteBtn.classList.toggle('active');

      favoriteBtn.setAttribute(
        'aria-pressed',
        String(isFavorite)
      );

      favoriteBtn.setAttribute(
        'aria-label',
        isFavorite ? '찜하기 취소' : '찜하기'
      );

    });


    // ========================================
    // 수량 및 가격 계산
    // ========================================

    const basePrice =
      selectedMenu.price;

    const toppingCheckboxes =
      document.querySelectorAll('.topping-checkbox');

    const minusBtn =
      document.getElementById('minusBtn');

    const plusBtn =
      document.getElementById('plusBtn');

    const quantityText =
      document.getElementById('quantity');

    const totalPrice =
      document.getElementById('totalPrice');

    const priceDescription =
      document.getElementById('priceDescription');


    // 기본 수량

    let quantity = 1;


    // 치즈폭탄 기존 기본 토핑 유지

    document.getElementById('cheeseTopping').checked =

      selectedKey === 'cheese';


    // ========================================
    // 기존 주문 옵션 복원
    // ========================================

    const savedQuantity =
      Number(params.get('quantity'));

    if (

      Number.isSafeInteger(savedQuantity) &&
      savedQuantity > 0 &&
      savedQuantity <= 99

    ) {

      quantity = savedQuantity;

    }


    // 맵기 복원

    if (params.has('spicy')) {

      document.querySelectorAll('input[name="spicy"]')

        .forEach(function(input) {

          if (input.value === params.get('spicy')) {

            input.checked = true;

          }

        });

    }


    // 토핑 복원

    if (params.has('toppings')) {

      const savedToppings =
        params.get('toppings').split(',');

      toppingCheckboxes.forEach(function(checkbox, index) {

        checkbox.checked =
          savedToppings.includes(String(index));

      });

    }


    // 튀김 메뉴 토핑 해제

    if (isSide) {

      toppingCheckboxes.forEach(checkbox => {

        checkbox.checked = false;

        checkbox.disabled = true;

      });

    }


    // ========================================
    // 총 주문금액 자동 계산
    // ========================================

    function updatePrice() {

      let toppingTotal = 0;


      // 선택된 토핑 가격 합산

      toppingCheckboxes.forEach(function(checkbox) {

        if (checkbox.checked) {

          toppingTotal += Number(checkbox.value);

        }

      });


      // 기본 가격 + 토핑 가격 × 수량

      const total =

        (basePrice + toppingTotal) * quantity;


      // 수량 및 금액 표시

      quantityText.textContent = quantity;

      totalPrice.textContent = formatPrice(total);


      // 떡볶이 가격 설명

      priceDescription.textContent =

        '(기본 ' + formatPrice(basePrice) +

        ' + 토핑 ' + formatPrice(toppingTotal) +

        ')' + (quantity > 1 ? ' × ' + quantity : '');


      // 튀김 가격 설명

      if (isSide) {

        priceDescription.textContent =

          formatPrice(basePrice) +

          ' × ' + quantity + '개';

      }


      // 최소 1개, 최대 99개

      minusBtn.disabled = quantity <= 1;

      plusBtn.disabled = quantity >= 99;

    }


    // ========================================
    // 토핑 변경
    // ========================================

    toppingCheckboxes.forEach(function(checkbox) {

      checkbox.addEventListener(
        'change',
        updatePrice
      );

    });


    // ========================================
    // 수량 감소
    // ========================================

    minusBtn.addEventListener('click', function() {

      if (quantity > 1) {

        quantity--;

        updatePrice();

      }

    });


    // ========================================
    // 수량 증가
    // ========================================

    plusBtn.addEventListener('click', function() {

      if (quantity < 99) {

        quantity++;

        updatePrice();

      }

    });


    // 최초 가격 표시

    updatePrice();


    // ========================================
    // 장바구니 담기
    //
    // 선택한 메뉴를 저장한 후
    // 반드시 장바구니 페이지로 이동
    // ========================================

    const addCartBtn =
      document.getElementById('addCartBtn');


    addCartBtn.addEventListener('click', function() {


      // 중복 클릭 방지

      addCartBtn.disabled = true;


      // 선택한 음식 주문 정보

      const row = {


        // 선택한 메뉴

        menu: selectedKey,


        // 선택한 맵기

        spicy: isSide

          ? ''

          : document.querySelector(
              'input[name="spicy"]:checked'
            ).value,


        // 선택한 토핑

        toppings: isSide

          ? []

          : Array.from(toppingCheckboxes)

              .flatMap((checkbox, index) =>

                checkbox.checked ? [index] : []

              ),


        // 선택한 수량

        quantity: quantity

      };


      // 장바구니 저장

      if (IpOrder.add(row)) {


        // 장바구니 페이지로 이동

        window.location.href =

          IpOrder.url('SUB/cart/cart.html');


      } else {


        // 저장 실패 시 버튼 다시 활성화

        addCartBtn.disabled = false;

      }

    });


    // 브라우저 뒤로가기 시 버튼 활성화

    window.addEventListener('pageshow', function() {

      addCartBtn.disabled = false;

    });


  </script>

</body>
</html>
