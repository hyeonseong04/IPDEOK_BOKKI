
<!DOCTYPE html>

<head>

  <title>입덕볶이 - 떡볶이 메뉴</title>

  <!-- Noto Sans KR -->

  <!-- 외부 CSS -->
  <link rel="stylesheet" href="CSS/list.css">

  <!-- Lucide 아이콘 -->
  <script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../../CSS/order.css">
<script src="../../order.js" defer></script>

</head>





<body>

  <div class="container">

    <div class="page-content">

      <!-- ========================================
           HEADER
      ========================================= -->

      <header class="header">

        <!-- 뒤로가기 -->

        <a href="../../index.html"
           class="back-btn"
           id="backBtn"
           aria-label="뒤로가기">

        <!-- 중앙 로고 -->

          <img src="img/ChatGPT 이미지 2026년 11월 24일 오전 11_19_26-1.png"
               alt="입덕볶이 로고">

        <!-- 햄버거 메뉴 -->

      <main>

        <!-- ========================================
             SECTION 01 : 메뉴 카테고리
        ========================================= -->

        <section class="category-section">

          <div class="category-list">

            <button type="button"
                    class="category-btn active"

                    aria-pressed="true">

            <button type="button"
                    class="category-btn"

            <button type="button"

        <!-- ========================================
             SECTION 02 : 떡볶이 메뉴
        ========================================= -->

          <div class="food-grid">


            <!-- 메뉴 01 : 시그니처 -->

            <a href="../detail/detail.html?menu=signature"

              <div class="food-image">

                <img src="img/01_입덕_시그니처_떡볶이.png"

              </div>

              <div class="food-info">

                <h3 class="food-name">

                  9,900원
                </p>

              </div>

            </a>


            <!-- 메뉴 02 : 치즈폭탄 -->

            <a href="../detail/detail.html?menu=cheese"
               class="food-item">

              <div class="food-image">

                <img src="img/02_치즈폭탄_떡볶이.png"
                     alt="치즈폭탄 떡볶이">

              </div>

              <div class="food-info">

                <h3 class="food-name">
                  치즈폭탄 떡볶이
                </h3>

                <p class="food-description">
                  매콤한 떡볶이에 모짜렐라 치즈 듬뿍
                </p>

                <p class="food-price">
                  11,900원
                </p>

              </div>

            </a>


            <!-- 메뉴 03 : 로제 -->

            <a href="../detail/detail.html?menu=rose"
               class="food-item">

              <div class="food-image">

                <img src="img/03_로제_떡볶이.png"
                     alt="로제 떡볶이">

              </div>

              <div class="food-info">

                <h3 class="food-name">
                  로제 떡볶이
                </h3>

                <p class="food-description">
                  부드럽고 꾸덕한 매콤 로제 떡볶이
                </p>

                <p class="food-price">
                  11,500원
                </p>

              </div>

            </a>


            <!-- 메뉴 04 : 바삭토핑 -->

            <a href="../detail/detail.html?menu=crispy"
               class="food-item">

              <div class="food-image">

                <img src="img/04_바삭토핑_떡볶이.png"
                     alt="바삭토핑 떡볶이">

              </div>

              <div class="food-info">

                <h3 class="food-name">
                  바삭토핑 떡볶이
                </h3>

                <p class="food-description">
                  바삭한 튀김 토핑과 매콤한 떡볶이
                </p>

                <p class="food-price">
                  12,500원
                </p>

              </div>

            </a>

          </div>

        </section>


        <!-- ========================================
             SECTION 03 : 사이드 메뉴
        ========================================= -->

        <section class="food-section side-section"
                 data-section="side">

          <h2 class="section-title">
            사이드 메뉴
          </h2>

          <p class="section-description">
            떡볶이와 함께 즐기는 바삭한 꿀조합!
          </p>


          <div class="food-grid">


            <!-- 메뉴 05 : 바삭 김말이 -->

            <button type="button"
                    class="food-item side-item"
                    data-menu="gimmari">

              <div class="food-image">

                <img src="img/05_바삭_김말이.png"
                     alt="바삭 김말이">

              </div>

              <div class="food-info">

                <h3 class="food-name">
                  바삭 김말이
                </h3>

                <p class="food-description">
                  겉은 바삭하고 속은 쫄깃한 김말이
                </p>

                <p class="food-price">
                  2,500원
                </p>

              </div>

            </button>


            <!-- 메뉴 06 : 바삭 군만두 -->

            <button type="button"
                    class="food-item side-item"
                    data-menu="dumpling">

              <div class="food-image">

                <img src="img/06_바삭_군만두.png"
                     alt="바삭 군만두">

              </div>

              <div class="food-info">

                <h3 class="food-name">
                  바삭 군만두
                </h3>

                <p class="food-description">
                  노릇노릇하게 튀긴 바삭한 군만두
                </p>

                <p class="food-price">
                  3,000원
                </p>

              </div>

            </button>


            <!-- 메뉴 07 : 통새우 튀김 -->

            <button type="button"
                    class="food-item side-item"
                    data-menu="shrimp">

              <div class="food-image">

                <img src="img/07_통새우_튀김.png"
                     alt="통새우 튀김">

              </div>

              <div class="food-info">

                <h3 class="food-name">
                  통새우 튀김
                </h3>

                <p class="food-description">
                  바삭한 튀김옷과 탱글한 통새우
                </p>

                <p class="food-price">
                  3,500원

              </div>

            </button>


            <!-- 메뉴 08 : 모둠 튀김 -->

            <button type="button"

              <div class="food-image">

                <img src="img/08_모둠_튀김.png"
                     alt="모둠 튀김">

              </div>

              <div class="food-info">

                <h3 class="food-name">
                  모둠 튀김
                </h3>

                <p class="food-description">
                  다양한 튀김을 한 번에 즐기는 구성
                </p>

                <p class="food-price">

                </p>

        </section>

      </main>

    </div>

  </div>


  <!-- ========================================
       햄버거 슬라이드 메뉴
  ========================================= -->

  <div class="menu-layer"
       id="menuLayer"
       aria-hidden="true"
       inert>

    <div class="menu-overlay"
         id="menuOverlay">
    </div>

    <aside class="side-menu"
           id="sideMenu"
           role="dialog"
           aria-modal="true"
           aria-label="페이지 이동 메뉴">

      <div class="side-menu-header">

        <button type="button"
                class="close-btn"
                id="closeBtn"
                aria-label="메뉴 닫기">

          <i data-lucide="x"></i>

        </button>

      </div>


      <!-- 사이드 메뉴 항목 -->

      <nav class="side-menu-nav">

        <a href="../list/list.html"
           aria-current="page">

          떡볶이 메뉴

        </a>

        <a href="../about/about.html">

          기업 소개

        </a>

        <a href="../community/community.html">

          커뮤니티

        </a>

        <a href="../login/login.html">

          로그인 / 회원가입

        </a>

      </nav>

    </aside>

  </div>


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script>

    // Lucide 아이콘 적용

    if (window.lucide) {

      lucide.createIcons();

    }


    // ========================================
    // 메뉴 카테고리 전환
    // ========================================

    const categoryButtons =
      document.querySelectorAll('.category-btn');

    const foodSections =
      document.querySelectorAll('.food-section');


    categoryButtons.forEach(function(button) {

      button.addEventListener('click', function() {

        const selectedCategory =
          button.dataset.category;


        // 선택한 버튼 색상 변경

        categoryButtons.forEach(function(item) {

          item.classList.toggle(
            'active',
            item === button
          );

          item.setAttribute(
            'aria-pressed',
            String(item === button)
          );

        });


        // 선택한 카테고리 메뉴 표시

        foodSections.forEach(function(section) {

          const sectionCategory =
            section.dataset.section;

          section.hidden =

            selectedCategory !== 'all' &&

            selectedCategory !== sectionCategory;

        });

      });

    });


    
// ========================================
// 사이드 메뉴 상세페이지 연결
// ========================================

document.querySelectorAll('.side-item')
  .forEach(function(item) {

    item.addEventListener('click', function() {

      const menu = item.dataset.menu;

      window.location.href =
        '../detail/detail.html?menu=' + menu;

    });

  });



    // ========================================
    // 햄버거 메뉴
    // ========================================

    const menuBtn = document.getElementById('menuBtn');

    const closeBtn = document.getElementById('closeBtn');

    const menuLayer = document.getElementById('menuLayer');

    const menuOverlay = document.getElementById('menuOverlay');

    const container = document.querySelector('.container');

    const menuLinks = document.querySelectorAll('.side-menu-nav a');


    // 메뉴 열기

    function openMenu() {

      menuLayer.inert = false;

      menuLayer.classList.add('active');

      menuLayer.setAttribute('aria-hidden', 'false');

      menuBtn.setAttribute('aria-expanded', 'true');

      document.body.classList.add('menu-open');

      closeBtn.focus({ preventScroll: true });

      container.inert = true;

    }


    // 메뉴 닫기

    function closeMenu() {

      container.inert = false;

      menuBtn.focus({ preventScroll: true });

      menuLayer.classList.remove('active');

      menuLayer.inert = true;

      menuLayer.setAttribute('aria-hidden', 'true');

      menuBtn.setAttribute('aria-expanded', 'false');

      document.body.classList.remove('menu-open');

    }


    menuBtn.addEventListener('click', openMenu);

    closeBtn.addEventListener('click', closeMenu);

    menuOverlay.addEventListener('click', closeMenu);


    // 현재 페이지 메뉴 클릭 시 메뉴 닫기

    menuLinks.forEach(function(link) {

      link.addEventListener('click', function(event) {

        if (link.getAttribute('aria-current') === 'page') {

          event.preventDefault();

        }

        closeMenu();

      });

    });


    // 키보드 ESC 및 Tab 처리

    document.addEventListener('keydown', function(event) {

      if (!menuLayer.classList.contains('active')) return;

      if (event.key === 'Escape') {

        closeMenu();

      }

      if (event.key === 'Tab') {

        const lastLink = menuLinks[menuLinks.length - 1];

        if (
          event.shiftKey &&
          document.activeElement === closeBtn
        ) {

          event.preventDefault();

          lastLink.focus();

        } else if (
          !event.shiftKey &&
          document.activeElement === lastLink
        ) {

          event.preventDefault();

          closeBtn.focus();

        }

      }

    });


    // ========================================
    // 뒤로가기 슬라이드 애니메이션
    // ========================================

    const backBtn = document.getElementById('backBtn');

    const pageContent = document.querySelector('.page-content');

    let isMoving = false;

    let moveTimer;


    function moveBack() {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(
        'transitionend',
        onTransitionEnd
      );

      window.location.href = backBtn.href;

    }


    function onTransitionEnd(event) {

      if (
        event.target === pageContent &&
        event.propertyName === 'transform'
      ) {

        moveBack();

      }

    }


    backBtn.addEventListener('click', function(event) {

      event.preventDefault();

      if (isMoving) return;

      isMoving = true;

      backBtn.classList.add('active');


      if (
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches
      ) {

        moveBack();

        return;

      }


      pageContent.addEventListener(
        'transitionend',
        onTransitionEnd
      );

      document.body.classList.add('page-leaving');

      moveTimer = setTimeout(moveBack, 450);

    });


    // ========================================
    // 브라우저 뒤로가기 시 초기화
    // ========================================

    window.addEventListener('pageshow', function() {

      clearTimeout(moveTimer);

      pageContent.removeEventListener(
        'transitionend',
        onTransitionEnd
      );

      document.body.classList.remove('page-leaving');

      backBtn.classList.remove('active');

      isMoving = false;

      if (menuLayer.classList.contains('active')) {

        closeMenu();

      }

    });

  </script>

  <!-- ========================================
     공통 로그인 프로필 및 로그아웃 기능
========================================= -->

<script>

  (function() {

    const sideNav =
      document.querySelector('.side-menu-nav');

    if (!sideNav) return;

    if (sideNav.dataset.authReady === 'true') return;


    // 로그인 / 회원가입 메뉴 찾기

    const authLink = Array.from(
      sideNav.querySelectorAll('a')
    ).find(link => {

      return link.textContent
        .replace(/\s/g, '')
        .includes('로그인/회원가입');

    });

    if (!authLink) return;

    sideNav.dataset.authReady = 'true';


    // 기존 로그인 메뉴 정보 저장

    const originalHref =
      authLink.getAttribute('href');

    const originalText =
      authLink.textContent.trim();

    const originalCurrent =
      authLink.getAttribute('aria-current');


    // ========================================
    // 사용자 프로필 생성
    // ========================================

    const profile = document.createElement('div');

    profile.className = 'user-profile';

    profile.hidden = true;

    profile.innerHTML = `

      <div class="profile-icon">

        <i data-lucide="user-round"></i>

      </div>

      <div class="profile-info">

        <p class="profile-name"></p>

        <p class="profile-message">
          오늘도 환영해요!
        </p>

      </div>

    `;


    // 기존 메뉴 상단에 프로필 삽입

    sideNav.before(profile);


    // ========================================
    // 로그인 상태 확인
    // ========================================

    function getLoginState() {

      try {

        return sessionStorage.getItem(
          'demoLogin'
        ) === 'true';

      } catch (error) {

        return false;

      }

    }


    // ========================================
    // 로그인 사용자 정보 표시
    // ========================================

    function updateLoginMenu() {

      if (getLoginState()) {

        const username =
          sessionStorage.getItem('demoUsername')
          || '입덕이';


        // 프로필 표시

        profile.hidden = false;

        profile.querySelector(
          '.profile-name'
        ).textContent = username + '님';


        // 로그아웃 메뉴 변경

        authLink.textContent = '로그아웃';

        authLink.href = '#';

        authLink.removeAttribute('aria-current');

        authLink.classList.add('logout-link');

      } else {

        // 프로필 숨기기

        profile.hidden = true;


        // 기존 로그인 메뉴 복구

        authLink.textContent = originalText;

        authLink.setAttribute(
          'href',
          originalHref
        );

        authLink.classList.remove('logout-link');

        if (originalCurrent !== null) {

          authLink.setAttribute(
            'aria-current',
            originalCurrent
          );

        }

      }

      if (window.lucide) {

        lucide.createIcons();

      }

    }


    // ========================================
    // 로그아웃 기능
    // ========================================

    authLink.addEventListener('click', event => {

      if (!getLoginState()) return;

      event.preventDefault();

      event.stopImmediatePropagation();


      const logoutConfirm =
        confirm('로그아웃 하시겠습니까?');

      if (!logoutConfirm) return;


      // 임시 로그인 정보 삭제

      try {

        sessionStorage.removeItem('demoLogin');

        sessionStorage.removeItem('demoUsername');

      } catch (error) {

        alert('로그아웃 상태 변경에 실패했습니다.');

        return;

      }


      // 사용자 정보 및 메뉴 업데이트

      updateLoginMenu();

      alert('로그아웃 되었습니다.');

    }, true);


    // 페이지 실행 시 로그인 상태 확인

    updateLoginMenu();


    // 브라우저 뒤로가기 시에도 상태 유지

    window.addEventListener(
      'pageshow',
      updateLoginMenu
    );

  })();

</script>

</body>
</html>
